# 推送 main 后发布 GitHub Pages。
# 注意：不能 path: . 整仓上传——仓库含 node_modules 等，会超过 artifact 限制导致 upload-pages-artifact 失败。
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 仅打包静态站点文件（避免整仓体积超限）
        run: |
          mkdir -p _site
          cp standalone.html index.html student.html teacher.html _site/
          cp .nojekyll _site/ 2>/dev/null || touch _site/.nojekyll
          cp grammartestmaterial.text topicdevelopmenttestmaterial.text wordingtestmaterial.text practice-bank.cache.json _site/
          cp -r "Listen&Repeat练习" _site/
          ls -la _site
          wc -c _site/standalone.html

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
