# 推送 main 后发布 GitHub Pages。
# 注意：不能 path: . 整仓上传——仓库含 node_modules 等，会超过 artifact 限制导致 upload-pages-artifact 失败。
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages 拉取 artifact 时部分环境需要（避免 pages-build-deployment 失败）
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # v5+ 使用 Node 24，避免 Node 20 弃用告警（2026 年起默认强制 Node 24）
      - uses: actions/checkout@v6

      - name: 仅打包静态站点文件（避免整仓体积超限）
        run: |
          mkdir -p _site
          cp standalone.html index.html student.html teacher.html fei-studio-brand.png _site/
          cp mock-grammar-data.js mock-wording-data.js mock-topic-data.js _site/
          cp .nojekyll _site/ 2>/dev/null || touch _site/.nojekyll
          cp grammartestmaterial.text topicdevelopmenttestmaterial.text wordingtestmaterial.text practice-bank.cache.json _site/
          cp brainstorrming_practice.text _site/
          cp -r "Listen&Repeat练习" _site/
          ls -la _site
          wc -c _site/standalone.html
          echo "---- _site 文件数（应远小于整仓，仅用于核对未误传全库）----"
          find _site -type f | wc -l

      - uses: actions/configure-pages@v5
      # 与 deploy-pages@v4 搭配时，upload-pages-artifact 用 v3 更稳定（v4+v4 组合曾出现 artifact 无法部署）
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
