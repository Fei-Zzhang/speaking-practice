                                encodeURIComponent(uname)
                            )
                              .then(function (r) {
                                return r.json().catch(function () {
                                  return {};
                                });
                              })
                              .then(function (d) {
                                if (d && d.ok && d.assignment) state.studentAssignmentDetail = d.assignment;
                              })
                              .catch(function () {});
                          }
                        })
                        .catch(function () {
                          state.realTestError = '无法连接提交接口（Node）';
                          state.realTestResult = null;
                          if (_batch) {
                            state.studentSubmitBusy = false;
                            state.studentPhase = 'ready';
                          }
                        })
                        .finally(function () {
                          if (_batch) {
                            state.studentPendingGrading = Math.max(0, (state.studentPendingGrading || 1) - 1);
                          } else {
                            state.realTestLoading = false;
                          }
                          render();
                        });
                    }, 150);
                  };
                  realRecorder.start(500);
                  state.studentPhase = 'recording';
                  state.realTestRecording = true;
                  state.realTestLoading = false;
                  state.realTestError = '';
                  state.realTestResult = null;
                  state.realTestSecondsLeft = SPEAKING_DURATION;
                  if (realTestTimerId) clearInterval(realTestTimerId);
                  realTestTimerId = setInterval(function () {
                    state.realTestSecondsLeft = Math.max(0, state.realTestSecondsLeft - 1);
                    var el = document.getElementById('realCountdownNum');
                    if (el) el.textContent = state.realTestSecondsLeft;
                    if (state.realTestSecondsLeft <= 0) {
                      clearInterval(realTestTimerId);
                      realTestTimerId = null;
                      if (realRecorder) { try { realRecorder.stop(); } catch (_) {} }
                    }
                  }, 1000);
                  render();
                }).catch(function () { alert('无法访问麦克风'); });
              } else {
                if (realTestTimerId) { clearInterval(realTestTimerId); realTestTimerId = null; }
                state.realTestSecondsLeft = SPEAKING_DURATION;
                stopTencentRealtimeAsr();
                stopRealPracticeSpeech();
                if (realRecorder) { try { realRecorder.stop(); } catch (_) {} }
                state.realTestRecording = false;
                render();
              }
            };
          }
          root.querySelector('[data-action=logout]').onclick = function () {
            clearCurrentUser();
            stopStudentReadTimer();
            if (realTestTimerId) { clearInterval(realTestTimerId); realTestTimerId = null; }
            stopTencentRealtimeAsr();
            stopRealPracticeSpeech();
            state.mainChoice = null;
            state.view = 'list';
            render();
          };
          return;
        }

        // ---------- 题目练习：按话题/按设问方式抽题并录音评测 ----------
        if (state.mainChoice === 'real') {
          var stNavPre = PORTAL === 'student' ? studentTopNavHtml() : '';
          // 1) 首次进入：拉取题库（从 docx 抽取并返回前端可用结构）
          if (!state.practiceBank && !state.practiceBankLoading) {
            state.practiceBankLoading = true;
            state.practiceBankError = '';
            fetchPracticeBank()
              .then(function (data) {
                if (!data || data.ok === false) {
                  state.practiceBankError = data && data.error ? data.error : '题库加载失败，请稍后重试。';
                } else {
                  state.practiceBank = data;
                  state.practiceBankError = '';
                }
              })
              .catch(function () {
                state.practiceBankError = '无法加载题库（请放 practice-bank.cache.json 或启动 Python 5001）。';
              })
              .finally(() => {
                state.practiceBankLoading = false;
                render();
              });
          }

          if (!state.practiceBank) {
            root.innerHTML =
              stNavPre +
              `
              <div class="header"><h1>题目练习</h1><div class="header-right"><button data-action="backMain">返回</button> ${headerRight()}</div></div>
              <div class="card">
                <h2>正在加载题库…</h2>
                <p style="color:var(--muted);margin-top:0.5rem">${state.practiceBankError ? escapeHtml(state.practiceBankError) : '正在加载…'}</p>
                ${state.practiceBankError ? '<button class="primary" style="margin-top:0.75rem" data-action="retryPracticeBank">重试加载</button>' : ''}
              </div>
            `;
            if (PORTAL === 'student') bindStudentTopNav(root);
            root.querySelector('[data-action=backMain]').onclick = function () {
              stopTencentRealtimeAsr();
              stopRealPracticeSpeech();
              if (PORTAL === 'student') {
                state.mainChoice = 'studentBankPick';
                state.studentNav = 'bank';
              } else {
              state.mainChoice = null;
              }
              state.realTestCategoryId = null;
              state.realTestMode = 'topic';
              state.realTestIndex = 0;
              state.realTestRecording = false;
              state.realTestLoading = false;
              state.realTestError = '';
              state.realTestResult = null;
              state.realWebSpeechLive = '';
              state.realTencentLive = '';
              render();
            };
            var retry = root.querySelector('[data-action=retryPracticeBank]');
            if (retry) retry.onclick = function () { state.practiceBank = null; state.practiceBankError = ''; state.practiceBankLoading = false; render(); };
            return;
          }

          // 2) 已拿到题库：展示两大类 + 当前小类题目
          if (!state.realTestMode) state.realTestMode = 'topic';
          const bank = state.practiceBank;
          const mode = state.realTestMode;
          const categories = mode === 'topic' ? (bank.topicCategories || []) : (bank.typeCategories || []);

          const modeTitle = mode === 'topic' ? '按话题分类' : '按设问方式分类';

          // 未选小类：显示小类列表
          if (!state.realTestCategoryId) {
            root.innerHTML =
              stNavPre +
              `
              <div class="header"><h1>题目练习</h1><div class="header-right"><button data-action="backMain">返回</button> ${headerRight()}</div></div>
              <div class="card" style="margin-bottom:1rem">
                <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
                  <button class="primary" ${mode === 'topic' ? '' : 'style="opacity:0.85"'} data-action="switchMode" data-mode="topic">
                    按话题分类（${(bank.topicCategories || []).length} 小类）
                  </button>
                  <button class="primary" ${mode === 'type' ? '' : 'style="opacity:0.85"'} data-action="switchMode" data-mode="type">
                    按设问方式分类（${(bank.typeCategories || []).length} 小类）
                  </button>
                </div>
              </div>
              ${(categories || []).map(function (c) {
                var qsLen = (c.questions && c.questions.length) ? c.questions.length : 0;
                return '<div class="card" data-action="pickCategory" data-cat="' + escapeHtml(c.id || '') + '" style="cursor:pointer;margin-bottom:0.75rem">' +
                  '<h2>' + escapeHtml(c.title || '') + ' <span style="font-size:0.85rem;font-weight:500;color:var(--muted)">(' + qsLen + ')</span></h2>' +
                  '</div>';
              }).join('')}
            `;

            root.querySelector('[data-action=backMain]').onclick = function () {
              stopTencentRealtimeAsr();
              stopRealPracticeSpeech();
              if (PORTAL === 'student') {
                state.mainChoice = 'studentBankPick';
                state.studentNav = 'bank';
              } else {
              state.mainChoice = null;
              }
              state.realTestCategoryId = null;
              state.realTestMode = 'topic';
              state.realTestIndex = 0;
              state.realTestRecording = false;
              state.realTestLoading = false;
              state.realTestError = '';
              state.realTestResult = null;
              state.realWebSpeechLive = '';
              state.realTencentLive = '';
              render();
            };
            if (PORTAL === 'student') bindStudentTopNav(root);

            root.querySelectorAll('[data-action=switchMode]').forEach(function (btn) {
              btn.onclick = function () {
                state.realTestMode = btn.getAttribute('data-mode');
                state.realTestCategoryId = null;
                state.realTestIndex = 0;
                state.realTestResult = null;
                state.realTestError = '';
                render();
              };
            });

            root.querySelectorAll('[data-action=pickCategory]').forEach(function (el) {
              el.onclick = function () {
                state.realTestCategoryId = el.getAttribute('data-cat');
                state.realTestIndex = 0;
                state.realTestResult = null;
                state.realTestError = '';
                render();
              };
            });
            return;
          }

          // 3) 小类题目页
          const cat = (categories || []).find(function (c) { return c.id === state.realTestCategoryId; });
          const qs = cat && cat.questions ? cat.questions : [];
          if (!qs.length) {
            root.innerHTML =
              stNavPre +
              `
              <div class="header"><h1>题目练习</h1><div class="header-right"><button data-action="backCategory">返回小类</button> ${headerRight()}</div></div>
              <div class="card">
                <p style="color:var(--muted);margin-top:0.5rem">该小类暂时没有题目。</p>
                <button class="primary" style="margin-top:1rem" data-action="backCategory">返回</button>
              </div>
            `;
            if (PORTAL === 'student') bindStudentTopNav(root);
            root.querySelectorAll('[data-action=backCategory]').forEach(function (b) {
              b.onclick = function () {
                state.realTestCategoryId = null;
                state.realTestIndex = 0;
                render();
              };
            });
            return;
          }

          const idx = state.realTestIndex != null ? Math.max(0, Math.min(state.realTestIndex, qs.length - 1)) : 0;
          state.realTestIndex = idx;
          const q = qs[idx] || {};

          const loading = state.realTestLoading;
          const recording = state.realTestRecording;
          const result = state.realTestResult;
          const error = state.realTestError;

          const statusHtml = loading
            ? '<div class="card" style="border-color:var(--accent);color:var(--accent)"><strong>正在评测，请稍候…</strong></div>'
            : '';

          const resultHtml = result ? (function () {
            return `
              <div class="card">
                <h2>评测结果</h2>
                ${studentTranscriptHtml(result)}
                <p style="color:var(--muted);font-size:0.9rem;margin-top:0.75rem;white-space:pre-wrap">${escapeHtml(buildSpeakingFeedback(result) || '')}</p>
                ${modelAnswerHtml(result)}
                ${debugApiResponseHtml(result)}
              </div>
            `;
          })() : '';

          const errorHtml = error
            ? '<div class="card" style="border-color:var(--wrong);color:var(--wrong)"><strong>' + escapeHtml(error) + '</strong></div>'
            : '';

          const navHtml = qs.length > 1
            ? '<div style="display:flex;gap:0.5rem;margin-bottom:1rem">' +
              (idx > 0 ? '<button data-action="prevQ">上一题</button>' : '') +
              '<span style="color:var(--muted);align-self:center">第 ' + (idx + 1) + ' / ' + qs.length + ' 题</span>' +
              (idx < qs.length - 1 ? '<button data-action="nextQ">下一题</button>' : '') +
              '</div>'
            : '';

          var transcriptBlockReal;
          if (PORTAL === 'student') {
            transcriptBlockReal = '';
          } else {
            transcriptBlockReal =
              '<div class="card">' +
              '<h3 style="margin:0 0 0.5rem;font-size:1.05rem">实时语音转写（浏览器）</h3>' +
              '<div id="realWebSpeechBox" class="transcript-box">' +
              (escapeHtml(state.realWebSpeechLive || '') || '（开始录音后显示）') +
              '</div>' +
              '<button type="button" class="primary" style="margin-top:0.5rem" id="btnRealSaveTranscript">将当前转写加入记录</button>' +
              '</div>' +
              '<div class="card">' +
              '<h3 style="margin:0 0 0.5rem;font-size:1.05rem">腾讯云实时转写（流式）</h3>' +
              '<div id="realTencentBox" class="transcript-box">' +
              (escapeHtml(state.realTencentLive || '') || '（录音中显示）') +
              '</div>' +
              '<button type="button" class="primary" style="margin-top:0.5rem" id="btnTencentSaveTranscript">将腾讯云转写加入记录</button>' +
              '</div>';
          }

          root.innerHTML =
            stNavPre +
            `
            <div class="header"><h1>题目练习 · ${escapeHtml(modeTitle)} · ${escapeHtml(cat.title || '')}</h1><div class="header-right"><button data-action="backCategory">返回小类</button> ${headerRight()}</div></div>
            ${navHtml}
            <div class="card">
              <h2>题目</h2>
              <p style="color:var(--text);margin-top:0.75rem;white-space:pre-wrap">${escapeHtml(q.refText || '')}</p>
            </div>
            <div class="card">
              ${recording ? `<div class="countdown-box ${state.realTestSecondsLeft <= 10 ? 'warn' : ''}" style="margin-bottom:1rem"><span class="num" id="realCountdownNum">${state.realTestSecondsLeft}</span><span style="color:var(--muted);font-size:1rem"> 秒</span></div>` : ''}
              <button class="primary" id="btnRealRecord" ${loading ? 'disabled' : ''}>
                ${recording ? '停止录音并开始评测' : '开始录音'}
              </button>
            </div>
            ${transcriptBlockReal}
            ${statusHtml}
            ${errorHtml}
            ${resultHtml}
          `;
          if (PORTAL === 'student') bindStudentTopNav(root);

          root.querySelector('[data-action=backCategory]').onclick = function () {
            if (realTestTimerId) { clearInterval(realTestTimerId); realTestTimerId = null; }
            stopTencentRealtimeAsr();
            stopRealPracticeSpeech();
            state.realTestSecondsLeft = SPEAKING_DURATION;
            if (realRecorder) { try { realRecorder.stop(); } catch (_) {} realRecorder = null; }
            if (realRecorderStream) { try { realRecorderStream.getTracks().forEach(t => t.stop()); } catch (_) {} realRecorderStream = null; }
            state.realTestCategoryId = null;
            state.realTestIndex = 0;
            state.realTestRecording = false;
            state.realTestLoading = false;
            state.realTestError = '';
            state.realTestResult = null;
            state.realWebSpeechLive = '';
            state.realTencentLive = '';
            render();
          };

          var prevBtn = root.querySelector('[data-action=prevQ]');
          if (prevBtn) {
            prevBtn.onclick = function () {
              stopTencentRealtimeAsr();
              stopRealPracticeSpeech();
              state.realTestIndex = Math.max(0, state.realTestIndex - 1);
              state.realTestResult = null;
              state.realTestError = '';
              state.realWebSpeechLive = '';
              state.realTencentLive = '';
              render();
            };
          }
          var nextBtn = root.querySelector('[data-action=nextQ]');
          if (nextBtn) {
            nextBtn.onclick = function () {
              stopTencentRealtimeAsr();
              stopRealPracticeSpeech();
              state.realTestIndex = Math.min(qs.length - 1, state.realTestIndex + 1);
              state.realTestResult = null;
              state.realTestError = '';
              state.realWebSpeechLive = '';
              state.realTencentLive = '';
              render();
            };
          }

          const btnRecord = document.getElementById('btnRealRecord');
          if (btnRecord && !loading) {
            btnRecord.onclick = function () {
              if (!state.realTestRecording) {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                  alert('当前浏览器不支持录音，请使用最新版 Chrome 或 Edge。');
                  return;
                }
                navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
                  stopTencentRealtimeAsr();
                  stopRealPracticeSpeech();
                  state.realWebSpeechLive = '';
                  state.realTencentLive = '';
                  state._studentLiveMeta = {
                    assignmentId: '',
                    questionId:
                      'practice|' +
                      (state.realTestMode || '') +
                      '|' +
                      (state.realTestCategoryId || '') +
                      '|' +
                      (state.realTestIndex || 0)
                  };
                  if (canUseTencentAsrStream()) {
                    startTencentRealtimeAsr(
                      stream,
                      function (text) {
                        state.realTencentLive = text;
                        scheduleInterviewLiveTranscriptPush(text, 'tencent', state._studentLiveMeta);
                        var el = document.getElementById('realTencentBox');
                        if (el) el.textContent = text || '（识别中…）';
                      },
                      function () {}
                    );
                  }
                  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                  if (SpeechRecognition) {
                    try {
                      realSpeechRecognition = new SpeechRecognition();
                      realSpeechRecognition.continuous = true;
                      realSpeechRecognition.interimResults = true;
                      realSpeechRecognition.lang = 'en-US';
                      realSpeechRecognition.onresult = function (e) {
                        var t = Array.from(e.results)
                          .map(function (r) {
                            return r[0].transcript;
                          })
                          .join('');
                        state.realWebSpeechLive = t;
                        scheduleInterviewLiveTranscriptPush(t, 'webspeech', state._studentLiveMeta);
                        var box = document.getElementById('realWebSpeechBox');
                        if (box) box.textContent = t || '（正在识别…）';
                      };
                      realSpeechRecognition.onerror = function () {};
                      realSpeechRecognition.start();
                    } catch (e) {}
                  }
                  realRecorderStream = stream;
                  realRecorderChunks = [];
                  try {
                    realRecorder = new MediaRecorder(stream);
                  } catch (e) {
                    alert('无法创建录音器：' + e.message);
                    stream.getTracks().forEach(function (t) {
                      t.stop();
                    });
                    realRecorderStream = null;
                    stopTencentRealtimeAsr();
                    stopRealPracticeSpeech();
                    return;
                  }
                  realCurrentRefText = q.refText || '';
                  realRecorder.ondataavailable = function (e) {
                    if (e.data && e.data.size > 0) realRecorderChunks.push(e.data);
                  };
                  realRecorder.onstop = function () {
                    if (PORTAL === 'student') pushInterviewTranscriptFinal(state._studentLiveMeta);
                    stopTencentRealtimeAsr();
                    stopRealPracticeSpeech();
                    if (realTestTimerId) { clearInterval(realTestTimerId); realTestTimerId = null; }
                    state.realTestSecondsLeft = SPEAKING_DURATION;
                    state.realTestRecording = false;
                    render();
                    setTimeout(function () {
                      const blob = new Blob(realRecorderChunks, { type: 'audio/webm' });
                      realRecorder = null;
                      if (realRecorderStream) {
                        try {
                          realRecorderStream.getTracks().forEach(function (t) {
                            t.stop();
                          });
                        } catch (_) {}
                        realRecorderStream = null;
                      }
                      if (blob.size === 0) {
                        state.realTestLoading = false;
                        state.realTestError = '录音数据为空，请重新录音并确保麦克风正常。';
                        state.realTestResult = null;
                        render();
                        return;
                      }
                      state.realTestLoading = true;
                      state.realTestError = '';
                      state.realTestResult = null;
                      render();

                      function finishEval(data, errMsg) {
                        state.realTestLoading = false;
                        if (errMsg) {
                          state.realTestError = errMsg;
                            state.realTestResult = null;
                        } else if (data && data.ok === false) {
                          state.realTestError = (data.message || data.error) || '评测失败';
                          state.realTestResult = null;
                        } else if (data && (data.ok === true || data.transcript != null || typeof data.overall === 'number')) {
                            state.realTestError = '';
                            state.realTestResult = data;
                        } else {
                          state.realTestError = (data && (data.error || data.message)) ? (data.error || data.message) : '口语评测失败，请稍后重试。';
                          state.realTestResult = null;
                          }
                          render();
                      }

                      // Interview 批改：Python TokenHub（/api/interview-correct 或 /api/upload-audio-correct），不再用 asr-eval/Ollama
                      runInterviewGrading(finishEval, blob);
                    }, 150);
                  };
                  realRecorder.start(500);
                  state.realTestRecording = true;
                  state.realTestLoading = false;
                  state.realTestError = '';
                  state.realTestResult = null;
                  state.realTestSecondsLeft = SPEAKING_DURATION;
                  if (realTestTimerId) clearInterval(realTestTimerId);
                  realTestTimerId = setInterval(function () {
                    state.realTestSecondsLeft = Math.max(0, state.realTestSecondsLeft - 1);
                    var el = document.getElementById('realCountdownNum');
                    if (el) el.textContent = state.realTestSecondsLeft;
                    if (state.realTestSecondsLeft <= 0) {
                      clearInterval(realTestTimerId);
                      realTestTimerId = null;
                      if (realRecorder) { try { realRecorder.stop(); } catch (_) {} }
                    }
                  }, 1000);
                  render();
                }).catch(function () {
                  alert('无法访问麦克风，请在浏览器地址栏允许本页面使用麦克风。');
                });
              } else {
                stopTencentRealtimeAsr();
                stopRealPracticeSpeech();
                if (realTestTimerId) { clearInterval(realTestTimerId); realTestTimerId = null; }
                state.realTestSecondsLeft = SPEAKING_DURATION;
                if (realRecorder) { try { realRecorder.stop(); } catch (_) {} }
                state.realTestRecording = false;
                render();
              }
            };
          }
          var btnSaveTr = document.getElementById('btnRealSaveTranscript');
          if (btnSaveTr) {
            btnSaveTr.onclick = function () {
              var box = document.getElementById('realWebSpeechBox');
              var txt = (box && box.textContent ? box.textContent : state.realWebSpeechLive || '').trim();
              if (!txt || txt.indexOf('（') === 0) {
                alert('暂无有效转写内容');
                return;
              }
              appendTranscriptLog(txt, { source: 'interview-real', ref: (q.refText || '').slice(0, 80) });
              alert('已加入转写记录');
            };
          }
          var btnTenc = document.getElementById('btnTencentSaveTranscript');
          if (btnTenc) {
            btnTenc.onclick = function () {
              var box = document.getElementById('realTencentBox');
              var txt = (box && box.textContent ? box.textContent : state.realTencentLive || '').trim();
              if (!txt || txt.indexOf('（') === 0) {
                alert('暂无腾讯云转写内容');
                return;
              }
              appendTranscriptLog(txt, { source: 'tencent-stream', ref: (q.refText || '').slice(0, 80) });
              alert('已加入转写记录');
            };
          }
          return;
        }

        // ---------- 上传录音：服务端 ASR + TokenHub（仅教师端；学生端题库不包含此项）----------
        if (state.mainChoice === 'upload') {
          if (PORTAL === 'student') {
            state.mainChoice = currentUser ? 'studentBankPick' : null;
            if (currentUser) state.studentNav = 'bank';
            state.realTestLoading = false;
            state.realTestError = '';
            state.realTestResult = null;
            render();
            return;
          }
          const loading = state.realTestLoading;
          const result = state.realTestResult;
          const error = state.realTestError;
          const stNav = PORTAL === 'student' ? studentTopNavHtml() : '';

          const statusHtml = loading
            ? '<div class="card" style="border-color:var(--accent);color:var(--accent)"><strong>正在上传并评测（ASR + TokenHub），请稍候…</strong></div>'
            : '';

          const resultHtml = result ? (function () {
            return `
              <div class="card">
                <h2>评测结果</h2>
                ${studentTranscriptHtml(result)}
                <p style="color:var(--muted);font-size:0.9rem;margin-top:0.75rem;white-space:pre-wrap">${escapeHtml(buildSpeakingFeedback(result) || '')}</p>
                ${modelAnswerHtml(result)}
                ${debugApiResponseHtml(result)}
              </div>
            `;
          })() : '';

          root.innerHTML =
            stNav +
            `
            <div class="header"><h1>上传录音批改</h1><div class="header-right"><button data-action="backUpload" type="button">返回</button> ${PORTAL === 'student' ? '' : headerRight()}</div></div>
            <div class="card">
              <h2>选择本地音频</h2>
              <p style="color:var(--muted);font-size:0.9rem;margin:0.25rem 0 0.5rem">由 Python 调用<strong>腾讯云录音文件识别</strong>（CreateRecTask，适合 45s 级长音频，单文件约 5MB 内），再经 <strong>TokenHub</strong> 批改。支持 m4a/webm/mp3 等，服务端可转码为 wav。</p>
              <input type="file" id="uploadAudioFile" accept="audio/*" style="margin-top:0.75rem">
              <button class="primary" id="btnUploadEval" type="button" style="margin-top:0.75rem" ${loading ? 'disabled' : ''}>开始评测</button>
            </div>
            ${statusHtml}
            ${error ? '<div class="card" style="border-color:var(--wrong);color:var(--wrong)"><strong>' + escapeHtml(error) + '</strong></div>' : ''}
            ${resultHtml}
          `;

          if (PORTAL === 'student' && root.querySelector) {
            bindStudentTopNav(root);
          }

          root.querySelector('[data-action=backUpload]').onclick = function () {
            state.mainChoice = PORTAL === 'student' && currentUser ? 'studentBankPick' : null;
            if (PORTAL === 'student') state.studentNav = 'bank';
            state.realTestLoading = false;
            state.realTestError = '';
            state.realTestResult = null;
            render();
          };
          if (PORTAL === 'teacher') {
            var lou = root.querySelector('[data-action=logout]');
            if (lou) {
              lou.onclick = function () {
                clearCurrentUser();
                stopStudentReadTimer();
                state.mainChoice = null;
                state.view = 'list';
                render();
              };
            }
          }

          const btnUpload = document.getElementById('btnUploadEval');
          const fileInput = document.getElementById('uploadAudioFile');
          if (btnUpload && !loading) {
            btnUpload.onclick = function () {
              const file = fileInput && fileInput.files && fileInput.files[0];
              if (!file) {
                alert('请先选择一个录音文件。');
                return;
              }
              const fd = new FormData();
              fd.append('audio', file, file.name);
              state.realTestLoading = true;
              state.realTestError = '';
              state.realTestResult = null;
              render();
              fetch(API_BASE + '/api/upload-audio-correct', { method: 'POST', body: fd })
                .then(r => r.json().catch(() => ({})))
                .then(data => {
                  if (!data || data.ok === false) {
                    state.realTestError = data && data.error ? data.error : '上传批改失败，请稍后再试。';
                    state.realTestResult = null;
                    state.realTestLoading = false;
                    render();
                    return;
                  }
                  state.realTestError = '';
                  state.realTestResult = data;
                  state.realTestLoading = false;
                  render();
                })
                .catch(() => {
                  state.realTestLoading = false;
                  state.realTestError = '无法连接 ' + API_BASE + '，请确认 Python 已部署且已配置 ASR+TokenHub。';
                  state.realTestResult = null;
                  render();
                });
            };
          }
          return;
        }

        // Mock Test：四部分入口
        if (state.mainChoice === 'mock' && state.mockPart === null) {
          root.innerHTML = `
            <div class="header"><h1>Mock Test</h1><div class="header-right"><button data-action="backMain">返回</button> ${headerRight()}</div></div>
            <p style="color:var(--muted);margin-bottom:1rem">选择练习部分</p>
            <div class="card" data-action="mockPart" data-part="grammar">
              <h2>Grammar</h2>
              <p>语法练习：级别1 选择题、级别2 填空题、级别3 引导造句（语音转文字，正确后 AI 提示）。题库来自 grammartestmaterial。</p>
              <button class="primary" style="margin-top:0.5rem">进入</button>
            </div>
            <div class="card" data-action="mockPart" data-part="wording">
              <h2>Wording</h2>
              <p>措辞练习：碎片重组 + 连词成句。初阶/中阶/高阶，每日 5+5 题。题库来自 wordingtestmaterial。</p>
              <button class="primary" style="margin-top:0.5rem">进入</button>
            </div>
            <div class="card" data-action="mockPart" data-part="pronunciation">
              <h2>Pronunciation</h2>
              <p>发音练习：暂未开放。后续可能对接 API 或改为人工评分。若有合适的前端练习方式可再接入。</p>
              <button disabled style="margin-top:0.5rem;opacity:0.7">暂未开放</button>
            </div>
            <div class="card" data-action="mockPart" data-part="topic">
              <h2>Topic Development</h2>
              <p>话题展开：初阶选词/合并/改错；中阶易混淆词/改写/改错；高阶段落填空/重组/自由写作。题库来自 topicdevelopmenttestmaterial。</p>
              <button class="primary" style="margin-top:0.5rem">进入</button>
            </div>
          `;
          root.querySelectorAll('[data-action=mockPart]').forEach(btn => {
            if (btn.dataset.part && btn.querySelector('button:not([disabled])')) {
              btn.onclick = () => { state.mockPart = btn.dataset.part; state.grammarTopicId = null; state.grammarLevel = null; state.wordingTier = null; state.topicTier = null; render(); };
            }
          });
          root.querySelector('[data-action=backMain]').onclick = () => { state.mainChoice = null; render(); };
          root.querySelector('[data-action=logout]').onclick = () => { clearCurrentUser(); state.mainChoice = null; state.mockPart = null; render(); };
          return;
        }

        // ---------- 总结页（完成并保存后进入） ----------
        if (state.mainChoice === 'mock' && state.summaryView && state.summaryData) {
          var d = state.summaryData;
          var total = d.total || 0;
          var correctCount = d.correctCount;
          var hasScore = correctCount != null;
          var pct = hasScore && total ? Math.round((correctCount / total) * 100) : 0;
          var scoreLine = hasScore ? '正确率：<strong>' + correctCount + '/' + total + '</strong> 题（' + pct + '%）' : '共 ' + total + ' 题（语音/自由作答，见下方逐题对照）';
          var itemsHtml = (d.items || []).map(function (it, i) {
            var row = '<div class="card" style="margin-bottom:0.75rem">';
            row += '<p style="color:var(--text);font-weight:600">' + (i + 1) + '. ' + escapeHtml(it.label || '') + '</p>';
            row += '<p style="color:var(--muted);font-size:0.9rem;white-space:pre-wrap;word-break:break-word">你的答案：' + escapeHtml(it.userAnswer || '—') + '</p>';
            row += '<p style="color:var(--muted);font-size:0.9rem">' + (it.correct ? '<span style="color:var(--correct)">✓ 正确</span>' : '参考答案：' + escapeHtml(it.correctAnswer || '—')) + '</p>';
            row += '</div>';
            return row;
          }).join('');
          root.innerHTML = `
            <div class="header"><h1>练习总结</h1><div class="header-right"><button id="summaryBack">返回</button> ${headerRight()}</div></div>
            <div class="card">
              <h2>${escapeHtml(d.sectionTitle || '')}</h2>
              <p style="font-size:1.1rem;margin-top:0.5rem">${scoreLine}</p>
            </div>
            <p style="color:var(--muted);margin:1rem 0 0.5rem">逐题对照</p>
            ${itemsHtml}
            <div class="actions" style="margin-top:1rem"><button id="summaryBack2" class="primary">返回</button></div>
          `;
          document.getElementById('summaryBack').onclick = function () { state.summaryView = null; state.summaryData = null; render(); };
          document.getElementById('summaryBack2').onclick = function () { state.summaryView = null; state.summaryData = null; render(); };
          return;
        }

        // ---------- Grammar ----------
        if (state.mockPart === 'grammar') {
          const topics = window.MOCK_GRAMMAR_TOPICS || [];
          if (!state.grammarTopicId) {
            root.innerHTML = `
              <div class="header"><h1>Grammar</h1><div class="header-right"><button data-action="backMock">返回 Mock Test</button> ${headerRight()}</div></div>
              <p style="color:var(--muted);margin-bottom:1rem">选择语法主题</p>
              ${topics.map(t => `
                <div class="card" data-topic-id="${t.id}">
                  <h2>${t.title}</h2>
                  <p style="font-size:0.9rem">级别1 选择题 · 级别2 填空题 · 级别3 引导造句（语音）</p>
                  <button class="primary" style="margin-top:0.5rem" data-grammar-topic="${t.id}">开始</button>
                </div>
              `).join('')}
            `;
            root.querySelectorAll('[data-grammar-topic]').forEach(btn => {
              btn.onclick = (e) => { e.stopPropagation(); state.grammarTopicId = btn.dataset.grammarTopic; state.grammarLevel = null; state.grammarIndex = 0; state.grammarAnswers = {}; state.grammarSubmitted = false; render(); };
            });
            root.querySelector('[data-action=backMock]').onclick = () => { state.mockPart = null; render(); };
            return;
          }
          const topic = topics.find(t => t.id === state.grammarTopicId);
          if (!topic) { state.grammarTopicId = null; render(); return; }
          if (state.grammarLevel === null) {
            root.innerHTML = `
              <div class="header"><h1>${topic.title}</h1><div class="header-right"><button data-action="backGrammarTopic">返回</button> ${headerRight()}</div></div>
              ${state.saveFeedback ? '<div class="card ai-prompt-box" style="margin-bottom:1rem">' + escapeHtml(state.saveFeedback) + '</div>' : ''}
              <p style="color:var(--muted);margin-bottom:1rem">选择级别</p>
              <div class="card" data-level="1"><h2>级别 1</h2><p>选择题</p><button class="primary" data-set-level="1">开始</button></div>
              <div class="card" data-level="2"><h2>级别 2</h2><p>填空题</p><button class="primary" data-set-level="2">开始</button></div>
              <div class="card" data-level="3"><h2>级别 3</h2><p>引导造句（语音转文字，不需对接 API，正确后 AI 提示）</p><button class="primary" data-set-level="3">开始</button></div>
            `;
            root.querySelectorAll('[data-set-level]').forEach(btn => {
              btn.onclick = (e) => { e.stopPropagation(); state.grammarLevel = parseInt(btn.dataset.setLevel, 10); state.grammarIndex = 0; state.grammarAnswers = {}; state.grammarSubmitted = false; state.saveFeedback = ''; render(); };
            });
            root.querySelector('[data-action=backGrammarTopic]').onclick = () => { state.grammarTopicId = null; state.saveFeedback = ''; render(); };
            return;
          }
          // Grammar 做题 / 结果
          if (state.grammarLevel === 1 && topic.level1) {
            const qs = topic.level1.questions;
            const idx = state.grammarIndex;
            const q = qs[idx];
            if (!q) { state.grammarLevel = null; state.grammarIndex = 0; render(); return; }
            const submitted = state.grammarSubmitted;
            const selected = state.grammarAnswers['l1_' + idx];
            const correct = selected === q.correctIndex;
            root.innerHTML = `
              <div class="header"><h1>${topic.title} · 级别1</h1><div class="header-right"><button data-action="backGrammarLevel">返回</button> ${headerRight()}</div></div>
              <div class="card">
                <p style="color:var(--text);margin-bottom:1rem">${idx + 1}. ${q.q}</p>
                <div class="mcq-options">
                  ${q.options.map((opt, i) => `
                    <label class="mcq-option">
                      <input type="radio" name="g1" value="${i}" ${selected === i ? 'checked' : ''} ${submitted ? 'disabled' : ''}>
                      <span>${opt}</span>${submitted && i === q.correctIndex ? ' <span style="color:var(--correct)">✓ 正确</span>' : ''}
                    </label>
                  `).join('')}
                </div>
                ${submitted ? '<p class="ai-prompt-box" style="margin-top:1rem">' + (correct ? '回答正确！' : '正确答案为：' + q.options[q.correctIndex]) + '</p>' : ''}
              </div>
              <div class="actions">
                <button data-action="backGrammarLevel">返回</button>
                ${idx > 0 ? '<button data-action="grammarPrev">上一题</button>' : ''}
                ${!submitted ? '<button class="primary" id="grammarSubmit">提交</button>' : (idx < qs.length - 1 ? '<button class="primary" data-action="grammarNext">下一题</button>' : '<button class="primary" id="grammarFinishL1">完成并保存</button>')}
              </div>
            `;
            root.querySelectorAll('input[name="g1"]').forEach(radio => {
              radio.onchange = () => { state.grammarAnswers['l1_' + idx] = parseInt(radio.value, 10); render(); };
            });
            if (document.getElementById('grammarSubmit')) {
              document.getElementById('grammarSubmit').onclick = () => {
                const el = root.querySelector('input[name="g1"]:checked');
                if (!el) { alert('请选择一项'); return; }
                state.grammarAnswers['l1_' + idx] = parseInt(el.value, 10);
                state.grammarSubmitted = true;
                render();
              };
            }
            if (document.getElementById('grammarFinishL1')) {
              document.getElementById('grammarFinishL1').onclick = function () {
                var qs = topic.level1.questions;
                var total = qs.length;
                var correct = 0;
                for (var i = 0; i < total; i++) { if (state.grammarAnswers['l1_' + i] === qs[i].correctIndex) correct++; }

              <div class="header"><h1>${tier.title} · 自由写作</h1><div class="header-right"><button data-action="backTopicSec">返回</button> ${headerRight()}</div></div>
              ${state.saveFeedback ? '<div class="card ai-prompt-box" style="margin-bottom:1rem">' + escapeHtml(state.saveFeedback) + '</div>' : ''}
              <div class="card">
                <p style="color:var(--text)">主题：${sectionData.topic}</p>
                <p style="color:var(--muted);margin-top:0.5rem">${sectionData.requirement}</p>
                <textarea class="edit-area" id="topicFreeWrite" rows="8" placeholder="在此写一段话（5-7句）…">${escapeHtml(savedText)}</textarea>
              </div>
              <div class="actions"><button data-action="backTopicSec">返回</button> <button class="primary" id="topicSubmitFree">提交并保存</button></div>
            `;
            if (document.getElementById('topicSubmitFree')) {
              document.getElementById('topicSubmitFree').onclick = function () {
                var text = (document.getElementById('topicFreeWrite').value || '').trim();
                state.topicAnswers['freeWrite'] = text;
                var count = text.length;
                saveMockPractice({ sectionId: 'mock-topic-' + state.topicTier + '-freeWrite', sectionTitle: tier.title + ' · 自由写作', answers: state.topicAnswers, correctCount: null, extra: text }, function (err, where) {
                  state.saveFeedback = err ? err : (where === '云端' ? '已保存到云端。共 ' + count + ' 字' : '已保存到本地。共 ' + count + ' 字');
                  state.summaryView = 'topic';
                  state.summaryData = { sectionTitle: tier.title + ' · 自由写作', total: 1, correctCount: null, items: [{ label: '主题：' + (sectionData.topic || ''), userAnswer: text || '—', correctAnswer: '（自由写作，无参考答案）', correct: null }] };
                  state.topicSection = null;
                  render();
                });
              };
            }
            root.querySelector('[data-action=backTopicSec]').onclick = () => { state.topicSection = null; state.saveFeedback = ''; render(); };
            return;
          }
          state.topicSection = null;
          render();
          return;
        }

        // 兼容：若从旧链接进入 sectionId 的 MCQ（保留原 Part 流程可删或保留一段占位）
        if (state.view === 'mcq' && state.sectionId) {
          const section = [{ id: 'part1', title: 'Part 1', hasMcq: true, hasSpeaking: true, mcqQuestions: [{ id: 'q1', question: 'Sample', options: ['A', 'B'], correctIndex: 0 }], speakingPrompt: 'Speak.' }].find(s => s.id === state.sectionId);
          if (!section) { state.sectionId = null; render(); return; }
        }

        // 选择题
        if (state.view === 'mcq' && section && section.hasMcq) {
          root.innerHTML = `
            <div class="header"><h1>口语练习</h1>${headerRightWrap()}</div>
            <div class="card"><h2>${section.title} · 选择题</h2><p>完成以下题目后提交，将进行批改。</p></div>
            ${section.mcqQuestions.map(q => `
              <div class="card">
                <p style="color:var(--text);margin-bottom:1rem">${q.question}</p>
                <div class="mcq-options">
                  ${q.options.map((opt, i) => `
                    <label class="mcq-option">
                      <input type="radio" name="${q.id}" value="${i}" ${state.mcqAnswers[q.id] === i ? 'checked' : ''}>
                      <span>${opt}</span>
                    </label>
                  `).join('')}
                </div>
              </div>
            `).join('')}
            <div class="actions">
              <button data-action="back">返回</button>
              <button class="primary" data-action="submitMcq">提交并批改</button>
            </div>
          `;
          root.querySelector('[data-action=back]').onclick = () => { state.view = 'list'; state.sectionId = null; render(); };
          root.querySelectorAll('[data-action=back]').forEach(b => { if (b.dataset.action === 'back') b.onclick = () => { state.view = 'list'; state.sectionId = null; render(); }; });
          const logoutMcq = root.querySelector('[data-action=logout]');
          if (logoutMcq) logoutMcq.onclick = () => { clearCurrentUser(); state.view = 'list'; state.sectionId = null; render(); };
          root.querySelector('[data-action=submitMcq]').onclick = () => {
            const answers = {};
            section.mcqQuestions.forEach(q => {
              const el = root.querySelector(`input[name="${q.id}"]:checked`);
              if (el) answers[q.id] = parseInt(el.value, 10);
            });
            if (Object.keys(answers).length !== section.mcqQuestions.length) { alert('请完成所有题目'); return; }
            const correctCount = section.mcqQuestions.filter(function (q) { return answers[q.id] === q.correctIndex; }).length;
            state.mcqAnswers = answers; state.mcqScore = correctCount; state.view = 'mcqResult'; render();
          };
          section.mcqQuestions.forEach(q => {
            root.querySelectorAll(`input[name="${q.id}"]`).forEach(radio => {
              radio.onchange = () => { state.mcqAnswers[q.id] = parseInt(radio.value, 10); };
            });
          });
          return;
        }

        // 选择题批改结果
        if (state.view === 'mcqResult' && section) {
          const results = section.mcqQuestions.map(q => ({ ...q, selected: state.mcqAnswers[q.id], correct: state.mcqAnswers[q.id] === q.correctIndex }));
          const correctCount = results.filter(r => r.correct).length;
          root.innerHTML = `
            <div class="header"><h1>口语练习</h1>${headerRightWrap()}</div>
            <div class="card"><h2>选择题批改结果</h2><p style="color:var(--text);margin-top:0.5rem">得分：${correctCount} / ${results.length}</p></div>
            ${results.map(r => `
              <div class="card result-item ${r.correct ? 'correct' : 'wrong'}">
                <p style="color:var(--text)">${r.question}</p>
                <p style="color:var(--muted);font-size:0.9rem">你的答案：${r.options[r.selected]}${!r.correct ? `<span class="result-correct">正确：${r.options[r.correctIndex]}</span>` : ''}</p>
              </div>
            `).join('')}
            <div class="actions">
              <button data-action="back">返回分区</button>
              ${section.hasSpeaking ? '<button class="primary" data-action="goSpeaking">进入口语作答</button>' : ''}
            </div>
          `;
          root.querySelectorAll('[data-action=back]').forEach(b => b.onclick = () => { state.view = 'list'; state.sectionId = null; render(); });
          const logoutRes = root.querySelector('[data-action=logout]');
          if (logoutRes) logoutRes.onclick = () => { clearCurrentUser(); state.view = 'list'; state.sectionId = null; render(); };
          const goSp = root.querySelector('[data-action=goSpeaking]');
          if (goSp) goSp.onclick = () => { state.view = 'speaking'; state.phase = 'idle'; state.transcript = ''; state.editCount = 0; state.isEditing = false; state.secondsLeft = SPEAKING_DURATION; render(); };
          return;
        }

        // 口语作答
        if (state.view === 'speaking' && section && section.hasSpeaking) {
          const showStart = state.phase === 'idle';
          const showCountdown = state.phase === 'counting' || state.phase === 'done';
          const showEdit = state.isEditing;
          root.innerHTML = `
            <div class="header"><h1>口语练习</h1>${headerRightWrap()}</div>
            <div class="card">
              <h2>${section.title} · 口语作答</h2>
              <p style="color:var(--text);margin:0.5rem 0">${section.speakingPrompt}</p>
            </div>
            ${showStart ? '<div class="card"><button class="primary" id="btnStart">开始答题</button></div>' : ''}
            ${showCountdown ? `
              <div class="card countdown-box ${state.secondsLeft <= 10 ? 'warn' : ''}">
                <span class="num" id="countdownNum">${state.secondsLeft}</span>
                <span style="color:var(--muted)">秒</span>
                ${state.phase === 'done' ? '<p style="margin:0.75rem 0 0;color:var(--warning)">时间到</p>' : ''}
              </div>
              ${!showEdit ? `
                <div class="card">
                  <p style="font-size:0.9rem;color:var(--muted)">当前内容（语音转写）</p>
                  <div class="transcript-box" id="transcriptBox">${state.transcript || '（正在识别…）'}</div>
                  ${state.phase === 'done' && state.editCount < 1 ? '<button id="btnEdit">修改文本（还可修改 1 次）</button>' : ''}
                  ${state.editCount >= 1 ? '<span style="font-size:0.9rem;color:var(--muted)">已使用二次修改</span>' : ''}
                </div>
              ` : `
                <div class="card">
                  <p style="font-size:0.9rem;color:var(--muted)">修改后的文本</p>
                  <textarea class="edit-area" id="editArea" rows="6">${state.finalText}</textarea>
                  <div class="actions">
                    <button id="btnCancelEdit">取消</button>
                    <button class="primary" id="btnSaveEdit">保存（算作第二次修改）</button>
                  </div>
                </div>
              `}
              ${state.phase === 'done' ? `
                <div class="actions">
                  <button data-action="back">返回</button>
                  <button class="primary" id="btnSubmit">提交并批改</button>
                </div>
              ` : ''}
            ` : ''}
          `;

          if (document.getElementById('btnStart')) {
            document.getElementById('btnStart').onclick = function () {
              const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
              if (!SpeechRecognition) { alert('当前浏览器不支持语音识别，请使用 Chrome 或 Edge。'); return; }
              if (timerId) clearInterval(timerId);
              timerId = null;
              state.phase = 'counting'; state.secondsLeft = SPEAKING_DURATION; state.transcript = ''; state.editCount = 0; state.isEditing = false;
              recognition = new SpeechRecognition();
              recognition.continuous = true;
              recognition.interimResults = true;
              recognition.lang = 'en-US';
              recognition.onresult = function (e) {
                state.transcript = Array.from(e.results).map(r => r[0].transcript).join('');
                const box = document.getElementById('transcriptBox');
                if (box) box.textContent = state.transcript || '（正在识别…）';
              };
              recognition.start();
              render();
              function tick() {
                state.secondsLeft--;
                const el = document.getElementById('countdownNum');
                if (el) el.textContent = state.secondsLeft;
                if (state.secondsLeft <= 0) { stopRecognition(); state.phase = 'done'; clearInterval(timerId); timerId = null; render(); return; }
                if (state.secondsLeft <= 10 && el) el.parentElement.classList.add('warn');
              }
              timerId = setInterval(tick, 1000);
            };
          }

          const backBtns = root.querySelectorAll('[data-action=back]');
          backBtns.forEach(b => b.onclick = () => { stopRecognition(); if (timerId) clearInterval(timerId); timerId = null; state.view = 'list'; state.sectionId = null; render(); });
          const logoutSp = root.querySelector('[data-action=logout]');
          if (logoutSp) logoutSp.onclick = () => { stopRecognition(); if (timerId) clearInterval(timerId); timerId = null; clearCurrentUser(); state.view = 'list'; state.sectionId = null; render(); };

          if (document.getElementById('btnEdit')) {
            document.getElementById('btnEdit').onclick = () => { state.isEditing = true; state.finalText = state.transcript; render(); };
          }
          if (document.getElementById('btnCancelEdit')) {
            document.getElementById('btnCancelEdit').onclick = () => { state.isEditing = false; render(); };
          }
          if (document.getElementById('btnSaveEdit')) {
            document.getElementById('btnSaveEdit').onclick = () => { state.transcript = document.getElementById('editArea').value; state.editCount++; state.isEditing = false; render(); };
          }
          if (document.getElementById('btnSubmit')) {
            document.getElementById('btnSubmit').onclick = function () {
              const text = (state.isEditing ? document.getElementById('editArea').value : state.transcript).trim();
              if (!text) { alert('请先完成口语内容再提交。'); return; }
              if (API_NODE) {
                fetch(API_NODE + '/api/practice', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    username: getCurrentUser(),
                    sectionId: section.id,
                    sectionTitle: section.title,
                    mcqAnswers: state.mcqAnswers,
                    mcqScore: state.mcqScore,
                    speakingText: text
                  })
                }).then(function (r) {
                  return r.json().then(function (data) {
                    if (data.ok) alert('已提交并保存到云数据库。');
                    else alert(data.message || ('HTTP ' + r.status + ' 提交失败'));
                  }, function () { alert('HTTP ' + r.status + '：服务器异常，请查看后端终端'); });
                }).catch(function () { alert('网络错误，未保存到云端。请确认 Node 后端已启动。'); });
              } else {
                alert('已提交。\n\n（配置 API_NODE 后，数据会保存到云数据库。）');
              }
            };
          }
          return;
        }
      }

      render();
    })();
    } catch (e) {
      document.getElementById('root').innerHTML = '<div style="padding:2rem;font-family:system-ui;color:#1d1d1f;background:#fff;min-height:100vh"><h1 style="color:#ef4444">页面报错</h1><pre style="overflow:auto;background:#f5f5f7;padding:1rem;border-radius:8px;border:1px solid #e0e0e5">' + (e && e.message ? e.message : String(e)) + '</pre><p>请按 F12 打开控制台查看完整错误。</p></div>';
    }
  </script>
</body>
</html>
