              errEl0.textContent = !ttPwd
                ? '请使用在线登录教师账号（离线登录无法拉取提交记录）。'
                : '未配置 API 地址';
            }
          } else {
            pollFn();
            teacherTodayPollTimer = setInterval(pollFn, 8000);
            var btnRefresh = document.getElementById('ttRefresh');
            if (btnRefresh) {
              btnRefresh.onclick = function () {
                pollFn();
              };
            }
          }
          return;
        }

        // ---------- 教师：任务详情（查看学生批改结果）----------
        if (state.mainChoice === 'teacherAssignment') {
          if (!state.teacherAssignmentId) {
            state.mainChoice = 'teacherList';
          }

          function loadTeacherAssignmentDetail() {
            if (state.teacherAssignmentLoading) return;
            if (!state.teacherAssignmentId) return;
            state.teacherAssignmentLoading = true;
            state.teacherAssignmentError = '';
            render();
            fetch(
              API_NODE + '/api/teacher/assignments/' + encodeURIComponent(state.teacherAssignmentId) + '?username=' + encodeURIComponent(currentUser)
            )
              .then(function (r) { return r.json(); })
              .then(function (data) {
                if (data && data.ok) state.teacherAssignmentDetail = data;
                else {
                  state.teacherAssignmentDetail = null;
                  state.teacherAssignmentError = (data && data.message) ? data.message : '加载失败';
                }
              })
              .catch(function () {
                state.teacherAssignmentDetail = null;
                state.teacherAssignmentError = '无法连接 ' + API_NODE;
              })
              .finally(function () {
                state.teacherAssignmentLoading = false;
                render();
              });
          }

          if (!state.teacherAssignmentDetail && !state.teacherAssignmentLoading) {
            loadTeacherAssignmentDetail();
          }

          if (!teacherAssignmentRefreshTimerId) {
            teacherAssignmentRefreshTimerId = setInterval(function () {
              if (state.mainChoice !== 'teacherAssignment') return;
              if (state.teacherAssignmentLoading) return;
              if (!state.teacherAssignmentId) return;
              fetch(
                API_NODE + '/api/teacher/assignments/' + encodeURIComponent(state.teacherAssignmentId) + '?username=' + encodeURIComponent(currentUser)
              )
                .then(function (r) { return r.json().catch(function () { return null; }); })
                .then(function (data) {
                  if (data && data.ok) {
                    state.teacherAssignmentDetail = data;
                    state.teacherAssignmentError = '';
                    render();
                  }
                })
                .catch(function () {});
            }, 5000);
          }

          var detail = state.teacherAssignmentDetail;
          var asg = detail && detail.assignment ? detail.assignment : null;
          var students = detail && Array.isArray(detail.students) ? detail.students : [];
          var qs = asg && Array.isArray(asg.items) ? asg.items : [];

          function shorten(s, maxLen) {
            s = String(s || '').replace(/\s+/g, ' ').trim();
            if (!s) return '';
            if (s.length <= maxLen) return s;
            return s.slice(0, Math.max(0, maxLen - 1)) + '…';
          }

          root.innerHTML = `
            <div class="header"><h1>任务详情 · ${escapeHtml((asg && asg.title) ? asg.title : '')}</h1><div class="header-right">
              <button data-action="backTM2">返回</button>
              <button data-action="refreshTA">刷新</button>
              ${headerRight()}
            </div></div>
            ${state.teacherAssignmentLoading ? '<div class="card"><p>加载中…</p></div>' : ''}
            ${state.teacherAssignmentError ? '<div class="card"><p style="color:var(--wrong)">' + escapeHtml(state.teacherAssignmentError) + '</p></div>' : ''}
          `;

          if (!state.teacherAssignmentLoading && detail && asg) {
            var qsHtml = qs.map(function (q) {
              var qid = q && q.questionId ? q.questionId : '';
              var text = q && q.refText ? q.refText : '';
              return { qid: qid, text: text };
            });

            var studentCardsHtml = students.map(function (s) {
              var subMap = s && s.submissionsByQuestion ? s.submissionsByQuestion : {};
              var stUsername = s && s.username ? s.username : '';
              var qBlocks = qsHtml.map(function (q) {
                var sub = q && q.qid ? subMap[q.qid] : null;
                if (!sub) {
                  return '<div style="margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid var(--border)"><strong>题目：</strong>' +
                    escapeHtml(shorten(q.text, 120)) +
                    '<div style="color:var(--muted);margin-top:0.35rem">未提交</div></div>';
                }
                var ev = sub.evalData || {};
                var fb = buildSpeakingFeedback(ev) || '';
                var hasEval = ev && typeof ev === 'object' && (ev.ok === true || !!ev.correctedTranscript || !!ev.transcript || (Array.isArray(ev.grammarItems) && ev.grammarItems.length));
                var hasAudio = !!sub.hasAudio;

                if (hasEval) {
                  return '<div style="margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid var(--border)"><strong>题目：</strong>' +
                    escapeHtml(shorten(q.text, 120)) +
                    '<div style="color:var(--muted);margin-top:0.35rem">已提交：' + escapeHtml(String(sub.submittedAt || '')) + '</div>' +
                    studentTranscriptHtml(ev) +
                    '<div style="white-space:pre-wrap;color:var(--text);font-size:0.9rem;margin-top:0.5rem">' + escapeHtml(fb) + '</div>' +
                    modelAnswerHtml(ev) +
                    '</div>';
                }

                if (!hasAudio) {
                  return '<div style="margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid var(--border)"><strong>题目：</strong>' +
                    escapeHtml(shorten(q.text, 120)) +
                    '<div style="color:var(--muted);margin-top:0.35rem">未提交音频</div></div>';
                }

                // 待批改：只有 zhangyufei 可以点批改
                var canEval = currentUser === 'zhangyufei';
                if (canEval) {
                  return '<div style="margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid var(--border)"><strong>题目：</strong>' +
                    escapeHtml(shorten(q.text, 120)) +
                    '<div style="color:var(--muted);margin-top:0.35rem">已提交音频：' + escapeHtml(String(sub.submittedAt || '')) + '</div>' +
                    '<div style="margin-top:0.5rem"><button class="primary" data-action="evalOne" data-qid="' + escapeHtml(q.qid) + '" data-student="' + escapeHtml(stUsername) + '">批改该题</button></div>' +
                    '</div>';
                }

                return '<div style="margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid var(--border)"><strong>题目：</strong>' +
                  escapeHtml(shorten(q.text, 120)) +
                  '<div style="color:var(--muted);margin-top:0.35rem">已提交音频，等待教师批改…</div></div>';
              }).join('');
              return '<div class="card"><h2 style="margin-bottom:0.5rem">' + escapeHtml(stUsername || '学生') + '</h2>' + qBlocks + '</div>';
            }).join('');

            root.innerHTML = root.innerHTML + `
              <div class="card">
              </div>
              ${studentCardsHtml}
            `;

            // 批改按钮：仅 zhangyufei 可用
            root.querySelectorAll('[data-action=evalOne]').forEach(function (btn) {
              btn.onclick = function () {
                var qid = btn.getAttribute('data-qid');
                var suser = btn.getAttribute('data-student');
                state.teacherAssignmentLoading = true;
                state.teacherAssignmentError = '';
                render();
                fetch(API_NODE + '/api/teacher/evaluate-submission', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    teacherUsername: currentUser,
                    assignmentId: asg.id,
                    studentUsername: suser,
                    questionId: qid
                  })
                }).then(function (r) { return r.json().catch(function () { return {}; }); })
                  .then(function (data) {
                    if (!data || data.ok !== true) {
                      state.teacherAssignmentError = (data && data.message) ? data.message : '批改失败';
                    }
                  }).catch(function () {
                    state.teacherAssignmentError = '无法连接 Node 批改接口';
                  }).finally(function () {
                    state.teacherAssignmentLoading = false;
                    state.teacherAssignmentError = state.teacherAssignmentError || '';
                    loadTeacherAssignmentDetail();
                  });
              };
            });
          }

          root.querySelector('[data-action=backTM2]').onclick = function () {
            if (teacherAssignmentRefreshTimerId) { clearInterval(teacherAssignmentRefreshTimerId); teacherAssignmentRefreshTimerId = null; }
            state.mainChoice = 'teacherList';
            state.teacherAssignmentId = null;
            state.teacherAssignmentDetail = null;
            state.teacherAssignmentError = '';
            render();
          };
          root.querySelector('[data-action=logout]').onclick = function () {
            if (teacherAssignmentRefreshTimerId) { clearInterval(teacherAssignmentRefreshTimerId); teacherAssignmentRefreshTimerId = null; }
            clearCurrentUser();
            stopStudentReadTimer();
            state.mainChoice = null;
            state.view = 'list';
            state.teacherAssignmentId = null;
            state.teacherAssignmentDetail = null;
            state.teacherAssignmentError = '';
            render();
          };

          // 手动刷新按钮（当自动刷新被网络影响时）
          var refreshBtn = root.querySelector('[data-action=refreshTA]');
          if (refreshBtn) refreshBtn.onclick = loadTeacherAssignmentDetail;

          return;
        }

        // ---------- 教师：已布置任务 ----------
        if (state.mainChoice === 'teacherList') {
          if (state.teacherAssignments === null && !state.teacherListLoading) {
            state.teacherListLoading = true;
            state.teacherListLoadError = '';
            fetch(API_NODE + '/api/teacher/assignments?username=' + encodeURIComponent(currentUser))
              .then(function (r) { return r.json(); })
              .then(function (data) {
                if (data && data.ok) state.teacherAssignments = data.list || [];
                else { state.teacherAssignments = []; state.teacherListLoadError = (data && data.message) || '加载失败'; }
              })
              .catch(function () {
                state.teacherAssignments = [];
                state.teacherListLoadError = '无法连接 ' + API_NODE;
              })
              .finally(function () {
                state.teacherListLoading = false;
                render();
              });
          }
          var tList = state.teacherAssignments;
          root.innerHTML = `
            <div class="header"><h1>已布置任务</h1><div class="header-right"><button data-action="backTM">返回</button> ${headerRight()}</div></div>
            ${state.teacherListLoading ? '<div class="card"><p>加载中…</p></div>' : ''}
            ${state.teacherListLoadError ? '<div class="card"><p style="color:var(--wrong)">' + escapeHtml(state.teacherListLoadError) + '</p></div>' : ''}
            ${(!state.teacherListLoading && Array.isArray(tList) && !tList.length) ? '<div class="card"><p style="color:var(--muted)">暂无任务</p></div>' : ''}
            ${Array.isArray(tList) ? tList.map(function (a) {
              return '<div class="card" style="cursor:pointer" data-open-assign="' + escapeHtml(a.id || '') + '"><h2>' + escapeHtml(a.title || '任务') + '</h2><p style="color:var(--muted);font-size:0.9rem">题目数：' + (a.itemCount || 0) + '</p><p style="color:var(--muted);font-size:0.85rem">' + escapeHtml(String(a.createdAt || '')) + '</p></div>';
            }).join('') : ''}
          `;
          root.querySelector('[data-action=backTM]').onclick = function () {
            state.mainChoice = null;
            state.teacherAssignments = null;
            state.teacherListLoadError = '';
            state.teacherAssignmentId = null;
            state.teacherAssignmentDetail = null;
            state.teacherAssignmentError = '';
            if (teacherAssignmentRefreshTimerId) { clearInterval(teacherAssignmentRefreshTimerId); teacherAssignmentRefreshTimerId = null; }
            render();
          };
          root.querySelector('[data-action=logout]').onclick = function () {
            clearCurrentUser();
            stopStudentReadTimer();
            state.mainChoice = null;
            state.view = 'list';
            state.teacherAssignmentId = null;
            state.teacherAssignmentDetail = null;
            state.teacherAssignmentError = '';
            if (teacherAssignmentRefreshTimerId) { clearInterval(teacherAssignmentRefreshTimerId); teacherAssignmentRefreshTimerId = null; }
            render();
          };

          root.querySelectorAll('[data-open-assign]').forEach(function (el) {
            el.onclick = function () {
              state.mainChoice = 'teacherAssignment';
              state.teacherAssignmentId = el.getAttribute('data-open-assign');
              state.teacherAssignmentDetail = null;
              state.teacherAssignmentLoading = false;
              state.teacherAssignmentError = '';
              if (teacherAssignmentRefreshTimerId) { clearInterval(teacherAssignmentRefreshTimerId); teacherAssignmentRefreshTimerId = null; }
              render();
            };
          });
          return;
        }

        // ---------- 教师：Interview 云端批改开通 ----------
        if (state.mainChoice === 'teacherInterviewApproval') {
          root.innerHTML = `
            <div class="header"><h1>Interview 云端批改</h1><div class="header-right"><button data-action="backIap">返回</button> ${headerRight()}</div></div>
            <div class="card">
              <label for="iapStudent">学生用户名（须与学生注册名一致）</label>
              <input type="text" id="iapStudent" class="fill-input" style="max-width:100%;margin-top:0.35rem" placeholder="例如：张三">
              <div style="margin-top:0.75rem">
                <label><input type="radio" name="iapOn" value="1" checked> 开通</label>
                <label style="margin-left:1rem"><input type="radio" name="iapOn" value="0"> 关闭</label>
              </div>
              <button type="button" class="primary" style="margin-top:1rem" id="btnIapSubmit">提交</button>
              <p id="iapMsg" style="margin-top:0.75rem;color:var(--muted);font-size:0.9rem"></p>
            </div>
          `;
          root.querySelector('[data-action=backIap]').onclick = function () {
            state.mainChoice = null;
            render();
          };
          root.querySelector('[data-action=logout]').onclick = function () {
            clearCurrentUser();
            state.mainChoice = null;
            state.view = 'list';
            render();
          };
          var btnIap = document.getElementById('btnIapSubmit');
          if (btnIap) {
            btnIap.onclick = function () {
              var stu = (document.getElementById('iapStudent') && document.getElementById('iapStudent').value || '').trim();
              if (!stu) {
                alert('请输入学生用户名');
                return;
              }
              var onEl = document.querySelector('input[name="iapOn"]:checked');
              var approved = onEl && onEl.value === '1';
              fetch(API_NODE + '/api/teacher/student-interview-grading', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  teacherUsername: currentUser,
                  studentUsername: stu,
                  approved: approved
                })
              })
                .then(function (r) {
                  return r.json();
                })
                .then(function (data) {
                  var el = document.getElementById('iapMsg');
                  if (data && data.ok) {
                    if (el) el.textContent = '已更新：' + stu + ' · 云端批改：' + (data.interviewGradingApproved ? '已开通' : '已关闭');
                  } else {
                    alert((data && data.message) || '操作失败');
                  }
                })
                .catch(function () {
                  alert('无法连接后端');
                });
            };
          }
          return;
        }

        // ---------- 教师：班级创建与打卡记录 ----------
        if (state.mainChoice === 'teacherClassrooms' && PORTAL === 'teacher' && currentUser) {
          if (state.teacherClassroomDetailId && state.teacherClassroomCheckins === null) {
            if (!state.teacherClassroomCheckinsLoading) {
              state.teacherClassroomCheckinsLoading = true;
              fetch(
                API_NODE +
                  '/api/teacher/classrooms/' +
                  encodeURIComponent(state.teacherClassroomDetailId) +
                  '/checkins?username=' +
                  encodeURIComponent(currentUser)
              )
                .then(function (r) {
                  return r.json();
                })
                .then(function (data) {
                  if (data && data.ok) state.teacherClassroomCheckins = data;
                  else state.teacherClassroomCheckins = { ok: false, message: (data && data.message) || '加载失败' };
                })
                .catch(function () {
                  state.teacherClassroomCheckins = { ok: false, message: '网络错误' };
                })
                .finally(function () {
                  state.teacherClassroomCheckinsLoading = false;
                  render();
                });
            }
            root.innerHTML =
              '<div class="header"><h1>班级打卡</h1><div class="header-right"><button type="button" data-action="backCrLoad">返回</button> ' +
              headerRight() +
              '</div></div><div class="card"><p>加载打卡记录中…</p></div>';
            root.querySelector('[data-action=backCrLoad]').onclick = function () {
              state.teacherClassroomDetailId = null;
              state.teacherClassroomCheckins = null;
              render();
            };
            var louL = root.querySelector('[data-action=logout]');
            if (louL) {
              louL.onclick = function () {
                clearCurrentUser();
                state.mainChoice = null;
                state.view = 'list';
                state.teacherClassroomDetailId = null;
                state.teacherClassroomCheckins = null;
                render();
              };
            }
            return;
          }

          if (state.teacherClassroomList === null && !state.teacherClassroomLoading) {
            state.teacherClassroomLoading = true;
            state.teacherClassroomErr = '';
            fetch(API_NODE + '/api/teacher/classrooms?username=' + encodeURIComponent(currentUser))
              .then(function (r) {
                return r.json();
              })
              .then(function (data) {
                if (data && data.ok) state.teacherClassroomList = data.list || [];
                else {
                  state.teacherClassroomList = [];
                  state.teacherClassroomErr = (data && data.message) || '加载失败';
                }
              })
              .catch(function () {
                state.teacherClassroomList = [];
                state.teacherClassroomErr = '无法连接 ' + API_NODE;
              })
              .finally(function () {
                state.teacherClassroomLoading = false;
                render();
              });
          }

          if (state.teacherClassroomDetailId && state.teacherClassroomCheckins && state.teacherClassroomCheckins.ok) {
            var tc = state.teacherClassroomCheckins;
            var rows = Array.isArray(tc.checkins) ? tc.checkins : [];
            root.innerHTML =
              '<div class="header"><h1>班级打卡 · ' +
              escapeHtml((tc.classroom && tc.classroom.name) || '') +
              '</h1><div class="header-right"><button type="button" data-action="backCrDetail">返回班级列表</button> ' +
              headerRight() +
              '</div></div>' +
              '<div class="card" style="margin-bottom:0.75rem;border-color:var(--border)">' +
              '<p style="margin:0;font-size:0.9rem;color:var(--muted)">以下为已保存的<strong>系统评测快照</strong>（与 TokenHub 学生端一致：转写 + 中文反馈 + 修改后英文）。面向学生的详细批改在其<strong>提交成功后立即</strong>显示；您可在微信等站外跟进，本页「站内备忘」仅供自己记录。</p>' +
              '</div>' +
              (rows
                    .map(function (row, idx) {
                      var ed = row.eval_data || {};
                      var fb = row.teacher_feedback || '';
                      return (
                        '<div class="card" data-checkin-row="' +
                        idx +
                        '"><p style="color:var(--muted);font-size:0.85rem">' +
                        escapeHtml(String(row.submitted_at || '')) +
                        ' · ' +
                        escapeHtml(row.student_username || '') +
                        '</p>' +
                        (row.note
                          ? '<p style="font-size:0.9rem;margin-top:0.35rem">学生备注：' + escapeHtml(row.note) + '</p>'
                          : '') +
                        '<div style="margin-top:0.65rem">' +
                        tokenHubEvalBlockHtml(ed) +
                        '</div>' +
                        '<label style="display:block;margin-top:1rem;font-size:0.9rem">站内备忘（选填，可与站外微信反馈对照）</label>' +
                        '<textarea class="fill-input" rows="2" style="max-width:100%;margin-top:0.35rem" data-feedback-ta="' +
                        escapeHtml(row.id) +
                        '">' +
                        escapeHtml(fb) +
                        '</textarea>' +
                        '<button type="button" class="primary" style="margin-top:0.5rem" data-save-feedback="' +
                        escapeHtml(row.id) +
                        '">保存备忘</button></div>'
                      );
                    })
                    .join('') ||
                '<div class="card"><p style="color:var(--muted)">暂无打卡记录</p></div>');
            root.querySelector('[data-action=backCrDetail]').onclick = function () {
              state.teacherClassroomDetailId = null;
              state.teacherClassroomCheckins = null;
              render();
            };
            root.querySelector('[data-action=logout]').onclick = function () {
              clearCurrentUser();
              state.mainChoice = null;
              state.view = 'list';
              state.teacherClassroomDetailId = null;
              state.teacherClassroomCheckins = null;
              render();
            };
            root.querySelectorAll('[data-save-feedback]').forEach(function (b) {
              b.onclick = function () {
                var id = b.getAttribute('data-save-feedback');
                var card = b.closest ? b.closest('.card') : null;
                var ta = card ? card.querySelector('textarea') : null;
                var text = ta ? ta.value : '';
                fetch(API_NODE + '/api/teacher/classroom-checkin-feedback', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    teacherUsername: currentUser,
                    checkinId: id,
                    feedback: text
                  })
                })
                  .then(function (r) {
                    return r.json();
                  })
                  .then(function (data) {
                    if (data && data.ok) alert('备忘已保存');
                    else alert((data && data.message) || '保存失败');
                  })
                  .catch(function () {
                    alert('无法连接后端');
                  });
              };
            });
            return;
          }

          if (state.teacherClassroomDetailId && state.teacherClassroomCheckins && !state.teacherClassroomCheckins.ok) {
            root.innerHTML =
              '<div class="header"><h1>班级打卡</h1><div class="header-right"><button type="button" data-action="backCrDetail2">返回</button> ' +
              headerRight() +
              '</div></div><div class="card" style="border-color:var(--wrong)"><p style="color:var(--wrong)">' +
              escapeHtml(state.teacherClassroomCheckins.message || '加载失败') +
              '</p></div>';
            root.querySelector('[data-action=backCrDetail2]').onclick = function () {
              state.teacherClassroomDetailId = null;
              state.teacherClassroomCheckins = null;
              render();
            };
            root.querySelector('[data-action=logout]').onclick = function () {
              clearCurrentUser();
              state.mainChoice = null;
              state.view = 'list';
              render();
            };
            return;
          }

          var tcl = state.teacherClassroomList;
          root.innerHTML =
            '<div class="header"><h1>班级 · 创建与打卡</h1><div class="header-right"><button type="button" data-action="backCrTeach">返回</button> ' +
            headerRight() +
            '</div></div>' +
            '<div class="card"><h2>新建班级</h2>' +
            '<label for="crNewName">班级名称</label>' +
            '<input type="text" id="crNewName" class="fill-input" style="margin-top:0.35rem;max-width:100%" placeholder="例如：周六早读 A 班" maxlength="80">' +
            '<label for="crNewDesc" style="margin-top:0.75rem;display:block">说明（可选）</label>' +
            '<input type="text" id="crNewDesc" class="fill-input" style="max-width:100%" placeholder="学生端可见" maxlength="500">' +
            '<button type="button" class="primary" style="margin-top:0.75rem" id="btnCrCreate">创建</button>' +
            '<p id="crCreateMsg" style="margin-top:0.5rem;font-size:0.9rem;color:var(--muted)"></p></div>' +
            (state.teacherClassroomLoading ? '<div class="card"><p>加载中…</p></div>' : '') +

          root.querySelector('[data-action=backCrTeach]').onclick = function () {

                method: 'POST',

                body: JSON.stringify({
                  teacherUsername: currentUser,
                  name: n,
                  description: d.trim() || null
                })
              })
                .then(function (r) {
                  return r.json();

                .then(function (data) {
                  var el = document.getElementById('crCreateMsg');

          root.querySelectorAll('[data-open-checkins]').forEach(function (b) {
            b.onclick = function () {
              state.teacherClassroomDetailId = b.getAttribute('data-open-checkins');

          root.querySelectorAll('[data-del-class]').forEach(function (b) {

                API_NODE + '/api/teacher/classrooms/' + encodeURIComponent(id) + '?username=' + encodeURIComponent(currentUser),

                  return r.json();

                  if (data && data.ok) {
                    state.teacherClassroomList = null;
                    render();

        // ---------- 学生：转写记录 ----------
        if (state.mainChoice === 'transcriptLog' && PORTAL === 'student') {
          var logs = getTranscriptLogs();
          root.innerHTML = `
            <div class="header"><h1>转写记录</h1><div class="header-right"><button data-action="backTL">返回</button> ${headerRight()}</div></div>
            <div class="card">
              <button type="button" id="btnClearTranscriptLog" style="margin-top:0.5rem">清空记录</button>
            </div>
            ${
              logs.length
                ? logs
                    .map(function (row, i) {
                      var d = new Date(row.t || 0);
                      return (
                        '<div class="card"><p style="color:var(--muted);font-size:0.8rem">' +
                        escapeHtml(d.toLocaleString()) +
                        '</p><div class="transcript-box" style="margin-top:0.5rem">' +
                        escapeHtml(row.text || '') +
                        '</div><button type="button" class="primary" style="margin-top:0.5rem" data-copy-tlog="' +
                        i +
                        '">复制</button></div>'
                      );
                    })
                    .join('')
                : '<div class="card"><p style="color:var(--muted)">暂无记录。在「Interview 题库练习」中录音时可保存转写。</p></div>'
            }
          `;
          root.querySelector('[data-action=backTL]').onclick = function () {
            state.mainChoice = null;
            render();
          };
          root.querySelector('[data-action=logout]').onclick = function () {
            clearCurrentUser();
            state.mainChoice = null;
            state.view = 'list';
            render();
          };
          root.querySelectorAll('[data-copy-tlog]').forEach(function (btn) {
            btn.onclick = function () {
              var idx = parseInt(btn.getAttribute('data-copy-tlog'), 10);
              var row = logs[idx];
              if (!row) return;
              var t = row.text || '';
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(t).then(function () {
                  alert('已复制');
                }).catch(function () {
                  alert(t);
                });
              } else {
                alert(t);
              }
            };
          });
          var clr = document.getElementById('btnClearTranscriptLog');
          if (clr) {
            clr.onclick = function () {
              if (!confirm('确定清空转写记录？')) return;
              try {
                sessionStorage.removeItem(TRANSCRIPT_LOG_KEY);

        // ---------- 学生：我的任务（列表）----------
        if (state.mainChoice === 'studentTasks') {
          if (state.studentAssignments === null && !state.studentAssignmentsLoading) {
            state.studentAssignmentsLoading = true;
            state.studentListLoadError = '';
            fetch(API_NODE + '/api/student/assignments?username=' + encodeURIComponent(getStudentTaskName()))
              .then(function (r) { return r.json(); })
              .then(function (data) {
                if (data && data.ok) state.studentAssignments = data.list || [];
                else { state.studentAssignments = []; state.studentListLoadError = (data && data.message) || '加载失败'; }
              })
              .catch(function () {

                state.studentListLoadError = '无法连接 ' + API_NODE;

          root.innerHTML =

        // ---------- 教师：Listen & Repeat 按全局组号布置整套（本地题库，不请求 Python）----------
        if (state.mainChoice === 'teacherAssignLR') {

              '）' +
              '<ul style="margin:0.5rem 0 0 1rem;padding:0;list-style:disc">' +

                  var n = (g.sentences && g.sentences.length) || 0;
                  var peek = (g.sentences && g.sentences[0] ? g.sentences[0] : '').slice(0, 80);
                  return (
                    '<li style="margin:0.35rem 0"><strong>' +

          root.innerHTML = `

                <button type="button" id="btnLrFillSeq" style="padding:0.55rem 1rem;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer">填入「序1-${LR_BANK.length}」</button>
              </div>
              ${previewHtml}
            </div>
            <div class="card">
              <label style="display:block;font-weight:600;margin-bottom:0.35rem">学生姓名</label>
              <textarea id="lrTeacherStudents" style="width:100%;min-height:100px;padding:0.6rem;border-radius:8px;border:1px solid var(--border);font-family:inherit;margin-bottom:1rem" placeholder="张三&#10;李四">${escapeHtml(state.teacherAssignStudents)}</textarea>
              <label style="display:block;font-weight:600;margin-bottom:0.35rem">作业名称 <span style="color:var(--wrong)">*</span></label>
              <input type="text" id="lrTeacherTitle" style="width:100%;padding:0.6rem;border-radius:8px;border:1px solid var(--border)" placeholder="例如：第二周跟读作业" value="${escapeHtml(state.teacherAssignTitle)}">
              <button type="button" class="primary" style="margin-top:1rem" id="btnLrTeacherSubmit">确认布置</button>
            </div>`;

          var numEl = document.getElementById('lrTeacherNums');
          var btnPrev = document.getElementById('btnLrTeacherPreview');
          function persistLrTeacherForm() {

              persistLrTeacherForm();
              render();

          root.querySelector('[data-action=backLR0]').onclick = function () {
            state.mainChoice = null;
            state.teacherLRNums = '';
            render();

          root.querySelector('[data-action=logout]').onclick = function () {
            clearCurrentUser();
            state.mainChoice = null;
            state.view = 'list';
            render();

          var btnLr = document.getElementById('btnLrTeacherSubmit');
          if (btnLr) {
            btnLr.onclick = function () {
              state.teacherLRNums = (numEl && numEl.value) || '';
              state.teacherAssignTitle = (document.getElementById('lrTeacherTitle') && document.getElementById('lrTeacherTitle').value.trim()) || '';
              state.teacherAssignStudents = (document.getElementById('lrTeacherStudents') && document.getElementById('lrTeacherStudents').value) || '';
              var pr2 = parseLRWholeSetRange(state.teacherLRNums, LR_BANK);
              if (!pr2.ok || !pr2.groups.length) {
                alert(pr2.message || '请填写有效组号范围');
                return;
              }
              if (!state.teacherAssignTitle) {
                alert('请填写作业名称');
                return;
              }
              var rawSt = state.teacherAssignStudents;
              var students = rawSt.split(/[\s,，;；\n\r]+/).map(function (x) { return x.trim(); }).filter(Boolean);
              var uniq = [];
              students.forEach(function (s) {

              if (!uniq.length) {

              var items = buildLRItemsFromWholeGroups(pr2.groups);

        // ---------- 教师：选题并布置（题库 + 按套勾选）----------
        if (state.mainChoice === 'teacherAssign') {
          if (!state.practiceBank && !state.practiceBankLoading) {

            state.practiceBankError = '';

              .then(function (data) {
                if (!data || data.ok === false) {
                  state.practiceBankError = data && data.error ? data.error : '题库加载失败';

                  state.practiceBank = data;

                state.practiceBankError = '无法加载题库（请放 practice-bank.cache.json 或启动 ' + API_PYTHON + '）';

                state.practiceBankLoading = false;
                render();

          if (!state.practiceBank) {
            root.innerHTML = `

              <div class="card">
                <h2>正在加载题库…</h2>
                <p style="color:var(--muted);margin-top:0.5rem">${state.practiceBankError ? escapeHtml(state.practiceBankError) : '请稍候'}</p>

              state.mainChoice = null;
              state.practiceBank = null;
              render();

            if (rb) rb.onclick = function () { state.practiceBank = null; state.practiceBankError = ''; state.practiceBankLoading = false; render(); };
            root.querySelector('[data-action=logout]').onclick = function () { clearCurrentUser(); state.mainChoice = null; state.view = 'list'; render(); };
            return;

          var bankTA = state.practiceBank;
          var modeTA = state.realTestMode || 'topic';
          var categoriesTA = modeTA === 'topic' ? (bankTA.topicCategories || []) : (bankTA.typeCategories || []);
          var modeTitleTA = modeTA === 'topic' ? '按话题分类' : '按设问方式分类';

          if (!state.realTestCategoryId) {
            root.innerHTML = `
              <div class="header"><h1>选题并布置</h1><div class="header-right"><button data-action="backTA0">返回</button> ${headerRight()}</div></div>
              <div class="card" style="margin-bottom:1rem">
                <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
                  <button class="primary" ${modeTA === 'topic' ? '' : 'style="opacity:0.85"'} data-action="taMode" data-mode="topic">按话题</button>
                  <button class="primary" ${modeTA === 'type' ? '' : 'style="opacity:0.85"'} data-action="taMode" data-mode="type">按设问方式</button>
                </div>
              </div>
              ${categoriesTA.map(function (c) {
                return '<div class="card" style="cursor:pointer;margin-bottom:0.75rem" data-ta-cat="' + escapeHtml(c.id || '') + '"><h2>' + escapeHtml(c.title || '') + '</h2></div>';
              }).join('')}
            `;
            root.querySelector('[data-action=backTA0]').onclick = function () {
              state.mainChoice = null;
              state.realTestCategoryId = null;
              render();
            };
            root.querySelectorAll('[data-action=taMode]').forEach(function (b) {
              b.onclick = function () {
                state.realTestMode = b.getAttribute('data-mode');
                state.realTestCategoryId = null;
                render();
              };
            });
            root.querySelectorAll('[data-ta-cat]').forEach(function (el) {
              el.onclick = function () {
                state.realTestCategoryId = el.getAttribute('data-ta-cat');
                state.teacherAssignStep = 'pick';
                render();
              };
            });
            root.querySelector('[data-action=logout]').onclick = function () { clearCurrentUser(); state.mainChoice = null; state.view = 'list'; render(); };
            return;
          }

          var catTA = categoriesTA.find(function (c) { return c.id === state.realTestCategoryId; });
          var qsTA = catTA && catTA.questions ? catTA.questions : [];
          if (!qsTA.length) {
            root.innerHTML = `
              <div class="header"><h1>选题并布置</h1><div class="header-right"><button data-action="backTAC">返回</button> ${headerRight()}</div></div>
              <div class="card"><p>该小类暂无题目</p></div>`;
            root.querySelector('[data-action=backTAC]').onclick = function () { state.realTestCategoryId = null; render(); };

            return;
          }

          if (state.teacherAssignStep === 'form') {
            var selN = (state.teacherSelectedItems || []).length;
            root.innerHTML = `
              <div class="header"><h1>下发任务</h1><div class="header-right"><button data-action="backTAForm">上一步</button> ${headerRight()}</div></div>

                <p style="color:var(--muted)">已选 <strong>${selN}</strong> 道题</p>

                <textarea id="taStudents" style="width:100%;min-height:100px;padding:0.6rem;border-radius:8px;border:1px solid var(--border);font-family:inherit;margin-bottom:1rem" placeholder="张三&#10;李四"></textarea>
                <label style="display:block;margin-bottom:0.35rem;font-weight:600">作业名称 <span style="color:var(--wrong)">*</span></label>
                <input type="text" id="taTitle" style="width:100%;padding:0.6rem;border-radius:8px;border:1px solid var(--border)" placeholder="例如：第一周口语作业">
                <button class="primary" style="margin-top:1rem" id="btnTaSubmit">确认布置</button>
              </div>`;
            root.querySelector('[data-action=backTAForm]').onclick = function () { state.teacherAssignStep = 'pick'; render(); };
            (function () {
              var ti = document.getElementById('taTitle');
              var ts = document.getElementById('taStudents');
              if (ti) ti.value = state.teacherAssignTitle || '';
              if (ts) ts.value = state.teacherAssignStudents || '';
            })();
            root.querySelector('#btnTaSubmit').onclick = function () {
              state.teacherAssignTitle = (document.getElementById('taTitle').value || '').trim();
              state.teacherAssignStudents = document.getElementById('taStudents').value || '';
              var items = state.teacherSelectedItems || [];
              if (!items.length) { alert('请至少选择一道题'); return; }
              if (!state.teacherAssignTitle) { alert('请填写作业名称'); return; }
              var raw = state.teacherAssignStudents;
              var students = raw.split(/[\s,，;；\n\r]+/).map(function (x) { return x.trim(); }).filter(Boolean);
              var uniq = []; students.forEach(function (s) { if (uniq.indexOf(s) < 0) uniq.push(s); });
              if (!uniq.length) { alert('请填写至少一名学生姓名'); return; }
              fetch(API_NODE + '/api/teacher/assignments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  teacherUsername: currentUser,
                  title: state.teacherAssignTitle,
                  items: items,
                  students: uniq
                })
              }).then(function (r) { return r.json(); }).then(function (data) {
                if (data && data.ok) {
                  alert('布置成功');
                  state.mainChoice = null;
                  state.realTestCategoryId = null;
                  state.teacherSelectedItems = [];
                  state.teacherAssignStep = 'pick';
                  render();
                } else alert((data && data.message) || '布置失败');
              }).catch(function () { alert('无法连接后端'); });
            };
            root.querySelector('[data-action=logout]').onclick = function () { clearCurrentUser(); state.mainChoice = null; state.view = 'list'; render(); };
            return;
          }

          var setsTA = chunkArray(qsTA, QUESTIONS_PER_SET);
          var selectedKeys = {};
          (state.teacherSelectedItems || []).forEach(function (it) {
            selectedKeys[teacherSelectionKey(it)] = true;
          });
          var setsHtml = setsTA.map(function (setQs, si) {
            var rows = setQs.map(function (q, qi) {
              var globalIdx = si * QUESTIONS_PER_SET + qi;
              var itemObj = {
                mode: modeTA,
                categoryId: catTA.id,
                categoryTitle: catTA.title || '',
                questionId: q.id || ('q' + globalIdx),
                refText: q.refText || ''
              };
              var k = teacherSelectionKey(itemObj);
              var checked = selectedKeys[k] ? ' checked' : '';
              return '<label style="display:block;margin:0.6rem 0;padding:0.5rem;background:var(--bg);border-radius:8px;border:1px solid var(--border)">' +
                '<input type="checkbox" data-ta-qidx="' + globalIdx + '"' + checked + '> ' +
                '<span class="set-badge">第 ' + (si + 1) + ' 套</span> 第 ' + (globalIdx + 1) + ' 题' +
                '<div style="color:var(--text);margin-top:0.35rem;font-size:0.9rem">' + escapeHtml((q.refText || '').slice(0, 220)) + (q.refText && q.refText.length > 220 ? '…' : '') + '</div></label>';
            }).join('');
            return '<div class="card"><h2>第 ' + (si + 1) + ' 套 <span style="color:var(--muted);font-size:0.85rem">（' + setQs.length + ' 题）</span></h2>' + rows + '</div>';
          }).join('');

          root.innerHTML = `
            <div class="header"><h1>${escapeHtml(modeTitleTA)} · ${escapeHtml(catTA.title || '')}</h1><div class="header-right"><button data-action="backTAC">返回小类</button> ${headerRight()}</div></div>
            <div class="card" style="margin-bottom:1rem">
              <p style="color:var(--muted);font-size:0.9rem">共 ${qsTA.length} 题，分为 ${setsTA.length} 套（每套最多 ${QUESTIONS_PER_SET} 题）。勾选后点击下一步。</p>
              <button class="primary" id="btnTaNext" style="margin-top:0.5rem">下一步：填写学生姓名与作业名称</button>
            </div>
            ${setsHtml}
          `;
          root.querySelector('[data-action=backTAC]').onclick = function () { state.realTestCategoryId = null; state.teacherAssignStep = 'pick'; render(); };
          root.querySelectorAll('input[data-ta-qidx]').forEach(function (inp) {
            inp.onchange = function () {
              var idx = parseInt(inp.getAttribute('data-ta-qidx'), 10);
              var q = qsTA[idx];
              if (!q) return;
              var itemObj = {
                mode: modeTA,
                categoryId: catTA.id,
                categoryTitle: catTA.title || '',
                questionId: q.id || ('q' + idx),
                refText: q.refText || ''
              };
              var k = teacherSelectionKey(itemObj);
              var arr = (state.teacherSelectedItems || []).slice();
              var pos = -1;
              for (var i = 0; i < arr.length; i++) {
                if (teacherSelectionKey(arr[i]) === k) { pos = i; break; }
              }
              if (inp.checked) {
                if (pos < 0) arr.push(itemObj);
              } else {
                if (pos >= 0) arr.splice(pos, 1);
              }
              state.teacherSelectedItems = arr;
            };
          });
          root.querySelector('#btnTaNext').onclick = function () {
            if (!(state.teacherSelectedItems || []).length) { alert('请至少勾选一道题'); return; }
            state.teacherAssignStep = 'form';
            render();
          };
          root.querySelector('[data-action=logout]').onclick = function () { clearCurrentUser(); state.mainChoice = null; state.view = 'list'; render(); };
          return;
        }

        // ---------- 学生：执行单个任务（读题 10s + 录音 45s）----------
        if (state.mainChoice === 'studentTask' && state.studentAssignmentId) {
          if (!state.studentAssignmentDetail && !state.studentAssignmentLoading) {
            state.studentAssignmentLoading = true;
            fetch(API_NODE + '/api/student/assignments/' + encodeURIComponent(state.studentAssignmentId) + '?username=' + encodeURIComponent(getStudentTaskName()))
              .then(function (r) { return r.json(); })
              .then(function (data) {
                if (data && data.ok) state.studentAssignmentDetail = data.assignment;
                else state.studentAssignmentDetail = { _error: (data && data.message) || '加载失败' };
              })
              .catch(function () {
                state.studentAssignmentDetail = { _error: '无法连接后端' };
              })
              .finally(function () {
                state.studentAssignmentLoading = false;
                render();
              });
          }
          if (state.studentAssignmentLoading || !state.studentAssignmentDetail) {
            root.innerHTML = `
              <div class="header"><h1>任务</h1><div class="header-right"><button data-action="backST0">返回</button> ${headerRight()}</div></div>
              <div class="card"><p>加载中…</p></div>`;
            root.querySelector('[data-action=backST0]').onclick = function () {
              state.mainChoice = 'studentTasks';
              state.studentAssignmentId = null;
              state.studentAssignmentDetail = null;
              state.studentAssignments = null;
              stopStudentReadTimer();
              state.studentPhase = 'idle';
              render();
            };
            root.querySelector('[data-action=logout]').onclick = function () { clearCurrentUser(); stopStudentReadTimer(); state.mainChoice = null; state.view = 'list'; render(); };
            return;
          }
          var asg = state.studentAssignmentDetail;
          if (asg._error) {
            root.innerHTML = `
              <div class="header"><h1>任务</h1><div class="header-right"><button data-action="backST0">返回</button> ${headerRight()}</div></div>
              <div class="card"><p style="color:var(--wrong)">${escapeHtml(asg._error)}</p></div>`;
            root.querySelector('[data-action=backST0]').onclick = function () {
              state.mainChoice = 'studentTasks';
              state.studentAssignmentId = null;
              state.studentAssignmentDetail = null;
              state.studentAssignments = null;
              render();
            };
            root.querySelector('[data-action=logout]').onclick = function () { clearCurrentUser(); state.mainChoice = null; state.view = 'list'; render(); };
            return;
          }
          var itemsST = Array.isArray(asg.items) ? asg.items : [];
          if (
            itemsST.length &&
            itemsST.every(function (it) {
              return it.mode === 'listenRepeat';
            })
          ) {
            window.location.href = listenRepeatAssignmentUrl(asg.id);
            return;
          }
          if (!itemsST.length) {
            root.innerHTML = `
              <div class="header"><h1>任务</h1><div class="header-right"><button data-action="backST0">返回</button> ${headerRight()}</div></div>
              <div class="card"><p>没有题目。</p></div>`;
            root.querySelector('[data-action=backST0]').onclick = function () {
              state.mainChoice = 'studentTasks';
              state.studentAssignmentId = null;
              state.studentAssignmentDetail = null;
              state.studentAssignments = null;
              state._studentTaskHydrated = false;
              render();
            };
            root.querySelector('[data-action=logout]').onclick = function () { clearCurrentUser(); state.mainChoice = null; state.view = 'list'; render(); };
            return;
          }
          var subMap = asg.submissionsByQuestion || {};
          var useBatchFlow = itemsST.length >= 2;
          if (useBatchFlow && !state._studentTaskHydrated) {
            state._studentTaskHydrated = true;
            state.studentBatchSessionStartMs = null;
            state.studentBatchSessionEndMs = null;
            var _fi = findFirstIncompleteQuestionIndex(itemsST, subMap);
            if (_fi < 0) {
              state.studentFlowPhase = 'review';
              state.studentReviewIndex = 0;
            } else {
              state.studentFlowPhase = 'answer';
              state.studentTaskIndex = _fi;
              state.studentPhase = 'idle';
              state.studentReadTimerStarted = false;
            }
          }

          if (useBatchFlow && state.studentFlowPhase === 'review') {
            var rvIdx = Math.max(0, Math.min(state.studentReviewIndex || 0, itemsST.length - 1));
            state.studentReviewIndex = rvIdx;
            var rvItem = itemsST[rvIdx];
            var rvSub = getSubmissionForItem(subMap, rvItem, rvIdx);
            var rvEv = rvSub && rvSub.evalData ? rvSub.evalData : {};
            var rvHas = evalDataLooksComplete(rvEv);
            var rvTime = rvSub && rvSub.submittedAt ? String(rvSub.submittedAt) : '';
            var rvRef = (rvItem && rvItem.refText) ? rvItem.refText : '';
            var rvBody =
              '<div class="card"><h2>题目</h2><div class="no-copy" style="margin-top:0.75rem;line-height:1.5;font-size:1.05rem">' +
              escapeHtml(rvRef) +
              '</div></div>';
            if (rvHas) {
              rvBody +=
                '<div class="card"><h2>批改结果</h2><p style="color:var(--muted);font-size:0.85rem">提交时间：' +
                escapeHtml(rvTime) +
                '</p>' +
                studentTranscriptHtml(rvEv) +
                '<p style="white-space:pre-wrap;color:var(--text);font-size:0.9rem;margin-top:0.5rem">' +
                escapeHtml(buildSpeakingFeedback(rvEv) || '') +
                '</p>' +
                modelAnswerHtml(rvEv) +
                '</div>';
            } else {
              rvBody +=
                '<div class="card"><p style="color:var(--muted)">该题批改仍在生成中，请稍后点击「刷新结果」或返回任务列表再进入。</p></div>';
            }
            var rvDur =
              state.studentBatchSessionStartMs != null && state.studentBatchSessionEndMs != null
                ? '<div class="card" style="margin-bottom:0.75rem;font-size:0.95rem">本套题总用时：<strong>' +
                  formatDurationMs(state.studentBatchSessionEndMs - state.studentBatchSessionStartMs) +
                  '</strong></div>'
                : '';
            root.innerHTML = `
              <div class="header"><h1>${escapeHtml(asg.title || '作业复习')}</h1><div class="header-right"><button data-action="backST0">返回</button> ${headerRight()}</div></div>
              ${rvDur}
              <div style="display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center">
                ${rvIdx > 0 ? '<button data-action="revPrev">上一题</button>' : ''}
                <span style="color:var(--muted)">复习 第 ${rvIdx + 1} / ${itemsST.length} 题</span>
                ${rvIdx < itemsST.length - 1 ? '<button data-action="revNext">下一题</button>' : ''}
                <button data-action="revRefresh" style="margin-left:auto">刷新结果</button>
              </div>
              ${rvBody}
            `;
            root.querySelector('[data-action=backST0]').onclick = function () {
              state.mainChoice = 'studentTasks';
              state.studentAssignmentId = null;
              state.studentAssignmentDetail = null;
              state.studentAssignments = null;
              state._studentTaskHydrated = false;
              state.studentFlowPhase = 'answer';
              render();
            };
            var rp = root.querySelector('[data-action=revPrev]');
            if (rp) rp.onclick = function () { state.studentReviewIndex = rvIdx - 1; render(); };
            var rn = root.querySelector('[data-action=revNext]');
            if (rn) rn.onclick = function () { state.studentReviewIndex = rvIdx + 1; render(); };
            root.querySelector('[data-action=revRefresh]').onclick = function () {
              fetch(
                API_NODE +
                  '/api/student/assignments/' +
                  encodeURIComponent(state.studentAssignmentId) +
                  '?username=' +
                  encodeURIComponent(getStudentTaskName())
              )
                .then(function (r) {
                  return r.json();
                })
                .then(function (data) {
                  if (data && data.ok) state.studentAssignmentDetail = data.assignment;
                  render();
                })
                .catch(function () {});
            };
            root.querySelector('[data-action=logout]').onclick = function () {
              clearCurrentUser();
              state.mainChoice = null;
              state.view = 'list';
              render();
            };
            return;
          }

          if (useBatchFlow && state.studentFlowPhase === 'wrapup') {
            var pend = state.studentPendingGrading || 0;
            var wrapDur =
              state.studentBatchSessionStartMs != null && state.studentBatchSessionEndMs != null
                ? '<p style="margin-top:0.75rem">本套题总用时：<strong>' +
                  formatDurationMs(state.studentBatchSessionEndMs - state.studentBatchSessionStartMs) +
                  '</strong></p>'
                : '';
            root.innerHTML = `
              <div class="header"><h1>${escapeHtml(asg.title || '任务')}</h1><div class="header-right"><button data-action="backST0">返回</button> ${headerRight()}</div></div>
              <div class="card">
                <h2>全部题目已录音</h2>
                ${wrapDur}
                <p style="margin-top:0.75rem">批改队列：<strong>${pend}</strong></p>
                <button class="primary" style="margin-top:1rem" data-action="enterReview">进入复习</button>
              </div>
            `;
            root.querySelector('[data-action=backST0]').onclick = function () {
              state.mainChoice = 'studentTasks';
              state.studentAssignmentId = null;
              state.studentAssignmentDetail = null;
              state.studentAssignments = null;
              state._studentTaskHydrated = false;
              state.studentFlowPhase = 'answer';
              render();
            };
            root.querySelector('[data-action=enterReview]').onclick = function () {
              fetch(
                API_NODE +
                  '/api/student/assignments/' +
                  encodeURIComponent(state.studentAssignmentId) +
                  '?username=' +
                  encodeURIComponent(getStudentTaskName())
              )
                .then(function (r) {
                  return r.json();
                })
                .then(function (data) {
                  if (data && data.ok) state.studentAssignmentDetail = data.assignment;
                  state.studentFlowPhase = 'review';
                  state.studentReviewIndex = 0;
                  render();
                })
                .catch(function () {});
            };
            root.querySelector('[data-action=logout]').onclick = function () {
              clearCurrentUser();
              state.mainChoice = null;
              state.view = 'list';
              render();
            };
            return;
          }

          var idxST = Math.max(0, Math.min(state.studentTaskIndex || 0, Math.max(0, itemsST.length - 1)));
          state.studentTaskIndex = idxST;
          var cur = itemsST[idxST];
          if (!cur) {
            root.innerHTML = `
              <div class="header"><h1>任务完成</h1><div class="header-right"><button data-action="backST0">返回任务列表</button> ${headerRight()}</div></div>
              <div class="card"><p>没有题目或已全部浏览。</p></div>`;
            root.querySelector('[data-action=backST0]').onclick = function () {
              state.mainChoice = 'studentTasks';
              state.studentAssignmentId = null;
              state.studentAssignmentDetail = null;
              state.studentAssignments = null;
              stopStudentReadTimer();
              render();
            };
            root.querySelector('[data-action=logout]').onclick = function () { clearCurrentUser(); state.mainChoice = null; state.view = 'list'; render(); };
            return;
          }
          var qid = cur.questionId || ('q' + idxST);
          var subObj = getSubmissionForItem(subMap, cur, idxST);
          var submitted = !!subObj;
          var ev = (subObj && subObj.evalData) ? subObj.evalData : {};
          var hasEval =
            ev &&
            typeof ev === 'object' &&
            (ev.ok === true ||
              typeof ev.overall === 'number' ||
              !!ev.correctedTranscript ||
              !!ev.transcript ||
              (Array.isArray(ev.grammarItems) && ev.grammarItems.length));
          // 批量答题模式下，若仅存在提交记录但评测未完成（evalData 尚不完整），页面不应直接把该题当“已完成”而隐藏读题/录音区域。
          var completed = useBatchFlow ? !!hasEval : submitted;
          var refText = cur.refText || '';

          if (!completed && state.studentPhase === 'idle') {
            if (useBatchFlow && state.studentBatchSessionStartMs == null) {
              state.studentBatchSessionStartMs = Date.now();
            }
            state.studentPhase = 'reading';
            state.studentReadSecondsLeft = READING_DURATION;
            state.studentReadTimerStarted = false;
            var readKick = ++state.studentReadKickVersion;
            var readKickIdx = idxST;
            var readKickAsgId = asg.id;
            if (studentReadKickTimeoutId) {
              clearTimeout(studentReadKickTimeoutId);
              studentReadKickTimeoutId = null;
            }
            studentReadKickTimeoutId = setTimeout(function () {
              studentReadKickTimeoutId = null;
              if (readKick !== state.studentReadKickVersion) return;
              if (state.mainChoice !== 'studentTask' || state.studentAssignmentId !== readKickAsgId) return;
              if ((state.studentTaskIndex || 0) !== readKickIdx) return;
              if (state.studentPhase !== 'reading') return;
              if (state.realTestRecording || state.studentSubmitBusy) return;
              var asgNow = state.studentAssignmentDetail || {};
              var itemsNow = Array.isArray(asgNow.items) ? asgNow.items : [];
              var subNow = asgNow.submissionsByQuestion || {};
              // 若已有提交但评测未完成（evalData 不完整），仍允许读题倒计时开始。
              var subCheck = getSubmissionForItem(subNow, itemsNow[readKickIdx], readKickIdx);
              if (subCheck && evalDataLooksComplete(subCheck && subCheck.evalData)) return;
              if (state.studentReadTimerStarted) return;
              state.studentReadTimerStarted = true;
              stopStudentReadTimer();
              studentReadTimerId = setInterval(function () {
                state.studentReadSecondsLeft = Math.max(0, state.studentReadSecondsLeft - 1);
                var eln = document.getElementById('studentReadNum');
                if (eln) eln.textContent = state.studentReadSecondsLeft;
                if (state.studentReadSecondsLeft <= 0) {
                  stopStudentReadTimer();
                  state.studentPhase = 'ready';
                  state.studentReadTimerStarted = false;
                  render();
                }
              }, 1000);
              render();
            }, 100);
          }

          var readBlock = '';
          if (!completed) {
            if (state.studentPhase === 'reading') {
              readBlock = '<div class="countdown-box" style="margin-bottom:1rem"><span class="num" id="studentReadNum">' + state.studentReadSecondsLeft + '</span><span style="color:var(--muted)"> 秒读题</span></div>';
            } else if (state.studentPhase === 'ready') {
              readBlock = '<div class="card" style="border-color:var(--correct);margin-bottom:1rem"><strong>读题时间已结束，请点击下方开始录音（' + SPEAKING_DURATION + ' 秒）</strong></div>';
            }
          }

          var recHtml = '';
          if (!completed) {
            var disBusy = useBatchFlow ? state.studentSubmitBusy : state.realTestLoading;
            var dis =
              (state.studentPhase !== 'ready' && state.studentPhase !== 'recording') || disBusy;
            recHtml = '<div class="card"><button class="primary" id="btnStRecord" ' + (dis ? 'disabled' : '') + '>' + (state.realTestRecording ? '停止录音并提交音频' : '开始录音') + '</button></div>';
          }

          var isInterviewQ = cur.mode !== 'listenRepeat';
          var liveTransHtml = '';
          if (!completed && isInterviewQ && PORTAL !== 'student') {
            liveTransHtml =
              '<div class="card"><h3 style="margin:0 0 0.5rem;font-size:1.05rem">实时语音转写（浏览器）</h3>' +
              '<div id="realWebSpeechBox" class="transcript-box">' +
              (escapeHtml(state.realWebSpeechLive || '') || '（开始录音后显示）') +
              '</div></div>' +
              '<div class="card"><h3 style="margin:0 0 0.5rem;font-size:1.05rem">腾讯云实时转写（流式）</h3>' +
              '<div id="realTencentBox" class="transcript-box">' +
              (escapeHtml(state.realTencentLive || '') || '（录音中显示）') +
              '</div></div>';
          }

          var resHtml = '';
          if (!useBatchFlow && state.realTestLoading) {
            resHtml = '<div class="card" style="border-color:var(--accent)"><strong>正在提交音频…</strong></div>';
          }
          if (useBatchFlow && state.studentSubmitBusy) {
            resHtml +=
              '<div class="card" style="border-color:var(--accent)"><strong>正在上传本题录音…</strong></div>';
          }
          if (state.realTestError) resHtml += '<div class="card" style="border-color:var(--wrong)"><strong>' + escapeHtml(state.realTestError) + '</strong></div>';
          if (!useBatchFlow && submitted) {
            var submitTime = subObj && subObj.submittedAt ? String(subObj.submittedAt) : '';
            if (hasEval) {
              resHtml =
                '<div class="card"><h2>已提交并已批改</h2><p style="color:var(--muted);font-size:0.85rem">提交时间：' +
                escapeHtml(submitTime) +
                '</p>' +
                studentTranscriptHtml(ev) +
                '<p style="white-space:pre-wrap;color:var(--text);font-size:0.9rem;margin-top:0.5rem">' +
                escapeHtml(buildSpeakingFeedback(ev) || '') +
                '</p>' +
                modelAnswerHtml(ev) +
                '</div>';
            } else {
              resHtml = '<div class="card"><h2>已提交</h2><p style="color:var(--muted);font-size:0.85rem">提交时间：' + escapeHtml(submitTime) + '</p></div>';
            }
          }

          var batchBanner =
            useBatchFlow && hasPendingStudentTaskQueue()
              ? '<div class="card" style="border-color:var(--accent);margin-bottom:0.75rem;font-size:0.9rem">' +
                (state.studentSubmitBusy ? '上传中… ' : '') +
                ((state.studentPendingGrading || 0) > 0
                  ? '批改队列：' + (state.studentPendingGrading || 0)
                  : '')
              : '';
          var navRow =
            useBatchFlow
              ? '<div style="display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap"><span style="color:var(--muted);align-self:center">答题 第 ' +
                (idxST + 1) +
                ' / ' +
                itemsST.length +
                ' 题（全部录完后进入复习）</span></div>'
              : '<div style="display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap">' +
                (idxST > 0 ? '<button data-action="stPrev">上一题</button>' : '') +
                '<span style="color:var(--muted);align-self:center">第 ' +
                (idxST + 1) +
                ' / ' +
                itemsST.length +
                ' 题</span>' +
                (idxST < itemsST.length - 1 ? '<button data-action="stNext">下一题</button>' : '') +
                '</div>';
          root.innerHTML = `
            <div class="header"><h1>${escapeHtml(asg.title || '任务')}</h1><div class="header-right"><button data-action="backST0">返回</button> ${headerRight()}</div></div>
            ${batchBanner}
            ${navRow}
            <div class="card"><h2>题目</h2>
              <div id="studentPromptNoCopy" class="no-copy" style="margin-top:0.75rem;line-height:1.5;font-size:1.05rem">${escapeHtml(refText)}</div>
            </div>
            ${readBlock}
            ${state.realTestRecording ? '<div class="countdown-box ' + (state.realTestSecondsLeft <= 10 ? 'warn' : '') + '" style="margin-bottom:1rem"><span class="num" id="realCountdownNum">' + state.realTestSecondsLeft + '</span><span style="color:var(--muted)"> 秒</span></div>' : ''}
            ${recHtml}
            ${liveTransHtml}
            ${resHtml}
          `;

          var promptEl = document.getElementById('studentPromptNoCopy');
          if (promptEl) {
            ['copy', 'cut', 'paste', 'contextmenu'].forEach(function (ev) {
              promptEl.addEventListener(ev, function (e) { e.preventDefault(); return false; });
            });
          }

          root.querySelector('[data-action=backST0]').onclick = function () {
            if (realTestTimerId) { clearInterval(realTestTimerId); realTestTimerId = null; }
            stopStudentReadTimer();
            invalidateStudentReadKick();
            stopTencentRealtimeAsr();
            stopRealPracticeSpeech();
            state.realTestRecording = false;
            state.realTestLoading = false;
            state.studentSubmitBusy = false;
            state.mainChoice = 'studentTasks';
            state.studentAssignmentId = null;
            state.studentAssignmentDetail = null;
            state.studentAssignments = null;
            state.studentPhase = 'idle';
            state._studentTaskHydrated = false;
            state.studentFlowPhase = 'answer';
            state.studentPendingGrading = 0;
            state.studentBatchSessionStartMs = null;
            state.studentBatchSessionEndMs = null;
            state.realTestResult = null;
            state.realTestError = '';
            state.realWebSpeechLive = '';
            state.realTencentLive = '';
            render();
          };
          var stPrev = root.querySelector('[data-action=stPrev]');
          if (stPrev) stPrev.onclick = function () {
            if (realTestTimerId) { clearInterval(realTestTimerId); realTestTimerId = null; }
            stopStudentReadTimer();
            invalidateStudentReadKick();
            stopTencentRealtimeAsr();
            stopRealPracticeSpeech();
            state.studentTaskIndex = idxST - 1;
            state.studentPhase = 'idle';
            state.realTestRecording = false;
            state.realTestResult = null;
            state.realTestError = '';
            state.realWebSpeechLive = '';
            state.realTencentLive = '';
            render();
          };
          var stNext = root.querySelector('[data-action=stNext]');
          if (stNext) stNext.onclick = function () {
            if (realTestTimerId) { clearInterval(realTestTimerId); realTestTimerId = null; }
            stopStudentReadTimer();
            invalidateStudentReadKick();
            stopTencentRealtimeAsr();
            stopRealPracticeSpeech();
            state.studentTaskIndex = idxST + 1;
            state.studentPhase = 'idle';
            state.realTestRecording = false;
            state.realTestResult = null;
            state.realTestError = '';
            state.realWebSpeechLive = '';
            state.realTencentLive = '';
            render();
          };

          var btnSt = document.getElementById('btnStRecord');
          if (btnSt && !(useBatchFlow ? state.studentSubmitBusy : state.realTestLoading) && !completed) {
            btnSt.onclick = function () {
              if (state.studentPhase !== 'ready' && state.studentPhase !== 'recording') return;
              if (!state.realTestRecording) {
                invalidateStudentReadKick();
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                  alert('浏览器不支持录音');
                  return;
                }
                navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
                  stopTencentRealtimeAsr();
                  stopRealPracticeSpeech();
                  state.realWebSpeechLive = '';
                  state.realTencentLive = '';
                  state._studentLiveMeta = {
                    assignmentId: state.studentAssignmentId || '',
                    questionId: buildAssignmentQuestionKey(cur, idxST) || qid || ''
                  };
                  if (isInterviewQ && canUseTencentAsrStream()) {
                    startTencentRealtimeAsr(
                      stream,
                      function (text) {
                        state.realTencentLive = text;
                        scheduleInterviewLiveTranscriptPush(text, 'tencent', state._studentLiveMeta);
                        var el = document.getElementById('realTencentBox');
                        if (el) el.textContent = text || '（识别中…）';
                      },
                      function () {}
                    );
                  }
                  if (isInterviewQ) {
                    var SpeechRecognitionST = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if (SpeechRecognitionST) {
                      try {
                        realSpeechRecognition = new SpeechRecognitionST();
                        realSpeechRecognition.continuous = true;
                        realSpeechRecognition.interimResults = true;
                        realSpeechRecognition.lang = 'en-US';
                        realSpeechRecognition.onresult = function (e) {
                          var t = Array.from(e.results)
                            .map(function (r) {
                              return r[0].transcript;
                            })
                            .join('');
                          state.realWebSpeechLive = t;
                          scheduleInterviewLiveTranscriptPush(t, 'webspeech', state._studentLiveMeta);
                          var box = document.getElementById('realWebSpeechBox');
                          if (box) box.textContent = t || '（正在识别…）';
                        };
                        realSpeechRecognition.onerror = function () {};
                        realSpeechRecognition.start();
                      } catch (e) {}
                    }
                  }
                  realRecorderStream = stream;
                  realRecorderChunks = [];
                  var recOpts = null;
                  try {
                    if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                      recOpts = { mimeType: 'audio/webm;codecs=opus', audioBitsPerSecond: 64000 };
                    }
                  } catch (e) {}
                  try {
                    realRecorder = recOpts ? new MediaRecorder(stream, recOpts) : new MediaRecorder(stream);
                  } catch (e) {
                    try { realRecorder = new MediaRecorder(stream); } catch (e2) {
                      stopTencentRealtimeAsr();
                      stopRealPracticeSpeech();
                      alert('无法录音：' + e2.message);
                      stream.getTracks().forEach(function (t) { t.stop(); });
                      return;
                    }
                  }
                  realCurrentRefText = refText;
                  realRecorder.ondataavailable = function (e) {
                    if (e.data && e.data.size > 0) realRecorderChunks.push(e.data);
                  };
                  realRecorder.onstop = function () {
                    if (PORTAL === 'student') pushInterviewTranscriptFinal(state._studentLiveMeta);
                    stopTencentRealtimeAsr();
                    stopRealPracticeSpeech();
                    if (realTestTimerId) { clearInterval(realTestTimerId); realTestTimerId = null; }
                    state.realTestSecondsLeft = SPEAKING_DURATION;
                    state.realTestRecording = false;
                    state.studentPhase = 'ready';
                    render();
                    setTimeout(function () {
                      var blob = new Blob(realRecorderChunks, { type: 'audio/webm' });
                      realRecorder = null;
                      if (realRecorderStream) {
                        try { realRecorderStream.getTracks().forEach(function (t) { t.stop(); }); } catch (_) {}
                        realRecorderStream = null;
                      }
                      if (blob.size === 0) {
                        state.realTestLoading = false;
                        state.studentSubmitBusy = false;
                        state.realTestError = '录音为空';
                        state.realTestResult = null;
                        render();
                        return;
                      }
                      if (!getStudentTaskName()) {
                        state.realTestLoading = false;
                        state.studentSubmitBusy = false;
                        state.realTestError = '请先回到首页确认姓名';
                        state.realTestResult = null;
                        render();
                        return;
                      }
                      var capIdx = idxST;
                      var capQid = qid;
                      var capUqQid = buildAssignmentQuestionKey(cur, capIdx);
                      var _batch = useBatchFlow;
                      if (!_batch) {
                        state.realTestLoading = true;
                      } else {
                        state.studentSubmitBusy = true;
                      }
                      state.realTestError = '';
                      state.realTestResult = null;
                      render();

                      Promise.resolve().then(function () {
                          if (_batch) {
                            state.studentPendingGrading = (state.studentPendingGrading || 0) + 1;
                          }
                        var qs = new URLSearchParams({
                              username: getStudentTaskName(),
                              assignmentId: state.studentAssignmentId,
                          questionId: capUqQid || capQid,
                              refText: realCurrentRefText || ''
                        });
                        return fetch(API_NODE + '/api/student/submit-audio?' + qs.toString(), {
                          method: 'POST',
                          headers: { 'Content-Type': 'audio/webm' },
                          body: blob
                          });
                        })
                        .then(function (r) {
                          return r.json().catch(function () { return {}; }).then(function (data) {
                            return { okHttp: r.ok, status: r.status, data: data };
                          });
                        })
                        .then(function (res) {
                          var data = res.data;
                          if (!res.okHttp || !data || data.ok === false) {
                            state.realTestError =
                              (data && data.message) ? data.message : ('提交音频失败' + (res.status ? '（HTTP ' + res.status + '）' : ''));
                            if (_batch) {
                              state.studentSubmitBusy = false;
                              state.studentPhase = 'ready';
                            }
                            return;
                          }

                          var aid = state.studentAssignmentId;
                          var uname = getStudentTaskName();
                          var det = state.studentAssignmentDetail;
                          var edNorm =
                            data && data.evalData && typeof data.evalData === 'object' ? data.evalData : null;
                          if (det && !det._error && edNorm) {
                            if (!det.submissionsByQuestion) det.submissionsByQuestion = {};
                            var subRow = {
                              evalData: edNorm,
                              hasAudio: true,
                              submittedAt: new Date().toISOString()
                            };
                            if (capUqQid) det.submissionsByQuestion[capUqQid] = subRow;
                            det.submissionsByQuestion[capQid] = subRow;
                            det.submissionsByQuestion['q' + capIdx] = subRow;
                          }

                          state.realTestResult = null;
                          state.realTestError = '';

                          if (_batch) {
                            stopStudentReadTimer();
                            invalidateStudentReadKick();
                            state.studentSubmitBusy = false;
                            if (capIdx < itemsST.length - 1) {
                              state.studentTaskIndex = capIdx + 1;
                              state.studentPhase = 'idle';
                              state.studentReadTimerStarted = false;
                            } else {
                              state.studentFlowPhase = 'wrapup';
                              state.studentBatchSessionEndMs = Date.now();
                            }
                            render();
                            return;
                          }

                          state.studentPhase = 'idle';

                          if (API_NODE && aid && uname) {
                            return fetch(
                              API_NODE +
                                '/api/student/assignments/' +
                                encodeURIComponent(aid) +
                                '?username=' +
